function showPpurioAllPopup(sc, type, mon, wk, onlyStudentId){
  const existing = document.querySelector('.ppurio-popup');
  if(existing) existing.remove();

  const isScore = type === 'score';
  const recs = isScore ? sc.records.filter(r=>r.month===mon&&r.week===wk) : null;
  let targets = isScore
    ? sc.students.filter(s=>(s.parentPhone||s.phone) && recs.find(r=>r.sid===s.id))
    : sc.students.filter(s=>s.parentPhone||s.phone);
  let noPhone = isScore
    ? sc.students.filter(s=>!s.parentPhone&&!s.phone && recs?.find(r=>r.sid===s.id))
    : sc.students.filter(s=>!s.parentPhone&&!s.phone);
  if(onlyStudentId){
    targets = targets.filter(s=>s.id===onlyStudentId);
    noPhone = noPhone.filter(s=>s.id===onlyStudentId);
  }

  const popup = document.createElement('div');
  popup.className = 'ppurio-popup';
  popup.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center';

  // 학부모/학생 번호가 둘 다 있으면 각각 별도 메시지로 발송 — 한 명당 최대 2건(수신자별로 독립 발송/기록)
  const rows = targets.flatMap(s=>{
    const rec=isScore?recs.find(r=>r.sid===s.id):null;
    const vars=isScore?{
      '#{학생명}':s.name,'#{월}':mon,'#{주차}':wk
    }:{
      '#{학생명}':s.name,'#{학교명}':sc.name,'#{아이디}':s.id,'#{비밀번호}':s.pwd
    };
    const tpl=isScore?PPURIO_TPL_SCORE:PPURIO_TPL_ACCOUNT;
    const pfId=isScore?PPURIO_PFID_SCORE:PPURIO_PFID_ACCOUNT;
    const recipients=[];
    if(s.parentPhone)recipients.push({label:'학부모',phone:s.parentPhone.replace(/[^0-9]/g,'')});
    if(s.phone)recipients.push({label:'학생',phone:s.phone.replace(/[^0-9]/g,'')});
    return recipients.map(r=>({s, key:s.id+'_'+r.label, recipientLabel:r.label, phone:r.phone, vars, tpl, pfId}));
  });

  const rowsHtml = rows.map(({s, key, recipientLabel, phone, vars})=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F7F8FA">
      <div>
        <span style="font-weight:700;font-size:13px;color:#1A237E">${esc(s.name)}</span>
        <span style="font-size:10px;font-weight:700;color:${recipientLabel==='학부모'?'#1D4ED8':'#00897B'};background:${recipientLabel==='학부모'?'#EFF6FF':'#E0F7F4'};padding:2px 7px;border-radius:20px;margin-left:6px">${recipientLabel}</span>
        <span style="font-size:11px;color:#9BA3AF;margin-left:6px">${esc(phone.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'))}</span>
        ${isScore&&vars['전체점수']?`<span style="font-size:11px;color:#5C6470;margin-left:6px">${vars['전체점수']}</span>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="send-status-${key}" style="font-size:11px;color:#9BA3AF"></span>
        <button class="btn-preview-send" data-key="${key}"
          style="padding:5px 10px;background:#F7F8FA;border:1.5px solid #E8ECF0;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;color:#5C6470">미리보기</button>
        <button class="btn-single-send" data-key="${key}"
          style="padding:5px 12px;background:#FEE500;color:#000;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer">💬 발송</button>
      </div>
    </div>`).join('');

  popup.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:28px;max-width:500px;width:95%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:16px;font-weight:800;color:#1A237E">💬 ${isScore?'성적 알림':'ID/비번'} ${onlyStudentId?'발송':'일괄 발송'}</div>
        <button onclick="this.closest('.ppurio-popup').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9BA3AF">✕</button>
      </div>
      <div style="font-size:12px;color:#9BA3AF;margin-bottom:14px">${isScore?mon+' '+wk+' · ':''} 발송대상 ${targets.length}명 · 메시지 ${rows.length}건(학부모·학생 모두 발송) · 번호없음 ${noPhone.length}명</div>

      <!-- 전체 일괄 발송 버튼 -->
      <button id="btn-send-all"
        style="width:100%;padding:13px;background:#FEE500;color:#000;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:10px;transition:background 0.15s"
        onmouseover="this.style.background='#FDD835'" onmouseout="this.style.background='#FEE500'">
        💬 ${rows.length}건 일괄 발송
      </button>
      <div id="all-send-msg" style="font-size:12px;text-align:center;margin-bottom:12px;min-height:18px"></div>

      <div style="overflow-y:auto;flex:1">${rowsHtml}</div>
    </div>`;

  document.body.appendChild(popup);
  popup.onclick = e => { if(e.target===popup) popup.remove(); };

  // 전체 일괄 발송
  document.getElementById('btn-send-all').onclick = async () => {
    // 확인창
    if(!confirm(`${targets.length}명(메시지 ${rows.length}건 · 학부모+학생)에게 알림톡을 발송합니다.

취소하면 발송되지 않습니다.
계속하시겠습니까?`)) return;

    const btn = document.getElementById('btn-send-all');
    const allMsg = document.getElementById('all-send-msg');
    btn.disabled = true;
    btn.textContent = '발송 중...';
    btn.style.background = '#E8ECF0';
    btn.style.color = '#9BA3AF';

    let success = 0, fail = 0;
    for(const {s, key, recipientLabel, phone, vars, tpl, pfId} of rows){
      const statusEl = popup.querySelector(`.send-status-${key}`);
      if(statusEl) statusEl.textContent = '발송 중...';
      const sentAt = nowStr();
      try{
        const ppBody = { templateCode: tpl, to: phone, variables: vars, pfId };
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: {'Content-Type':'application/json','x-api-token':API_AUTH_TOKEN},
          body: JSON.stringify(ppBody)
        });
        if(res.ok){
          success++;
          if(statusEl){ statusEl.textContent='✓'; statusEl.style.color='#00897B'; }
          addSendLog(sc,{type: isScore?'score':'account', studentId: s.id, studentName: s.name, recipient: recipientLabel,
            phone, month: mon||'-', week: wk||'-', status:'success', errorMsg:'', sentAt});
        } else {
          fail++;
          const errData = await res.json().catch(()=>({}));
          if(statusEl){ statusEl.textContent='✗'; statusEl.style.color='#E53935'; }
          addSendLog(sc,{type: isScore?'score':'account', studentId: s.id, studentName: s.name, recipient: recipientLabel,
            phone, month: mon||'-', week: wk||'-', status:'fail', errorMsg: errData.message||String(res.status), sentAt});
        }
      } catch(e){
        fail++;
        if(statusEl){ statusEl.textContent='✗'; statusEl.style.color='#E53935'; }
        addSendLog(sc,{type: isScore?'score':'account', studentId: s.id, studentName: s.name, recipient: recipientLabel,
          phone, month: mon||'-', week: wk||'-', status:'fail', errorMsg: e.message||'네트워크 오류', sentAt});
      }
      await new Promise(r=>setTimeout(r,300)); // 과부하 방지
    }

    allMsg.textContent = `✓ ${success}건 완료${fail?` · ${fail}건 실패`:''}`;
    allMsg.style.color = fail ? '#E65100' : '#00897B';
    btn.textContent = `완료 (${success}/${rows.length})`;
    btn.style.background = '#E0F7F4';
    btn.style.color = '#00897B';
  };

  // 미리보기 버튼
  popup.querySelectorAll('.btn-preview-send').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.key;
      const row = rows.find(r=>r.key===key);
      if(!row) return;
      const varStr = Object.entries(row.vars)
        .map(([k,v])=>`<tr><td style="padding:5px 8px;font-weight:600;color:#5C6470;white-space:nowrap">${k}</td><td style="padding:5px 8px;color:#0D1117">${v}</td></tr>`)
        .join('');
      const preview = document.createElement('div');
      preview.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;display:flex;align-items:center;justify-content:center';
      preview.innerHTML = `
        <div style="background:#fff;border-radius:18px;padding:24px;max-width:420px;width:92%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.25)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <div style="font-size:15px;font-weight:800;color:#1A237E">발송 내용 미리보기</div>
            <button onclick="this.closest('div[style*=\"z-index:10000\"]').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9BA3AF">✕</button>
          </div>
          <div style="font-size:11px;font-weight:700;color:#9BA3AF;margin-bottom:6px;letter-spacing:0.5px">수신번호 (${esc(row.recipientLabel)})</div>
          <div style="font-size:13px;font-weight:600;color:#0D1117;margin-bottom:14px">${row.s.name} · ${row.phone}</div>
          <div style="font-size:11px;font-weight:700;color:#9BA3AF;margin-bottom:6px;letter-spacing:0.5px">템플릿 변수</div>
          <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px;border:0.5px solid #F0F2F5;border-radius:8px;overflow:hidden">
            <tbody>${varStr}</tbody>
          </table>
          <div style="font-size:11px;color:#9BA3AF">※ 실제 메시지는 솔라피 템플릿에 위 변수가 삽입되어 발송됩니다</div>
        </div>`;
      document.body.appendChild(preview);
      preview.onclick = e => { if(e.target===preview) preview.remove(); };
    };
  });

  // 개별 발송 버튼
  popup.querySelectorAll('.btn-single-send').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.key;
      const row = rows.find(r=>r.key===key);
      if(!row) return;

      if(!confirm(`${row.s.name} 학생(${row.recipientLabel})에게 알림톡을 발송합니다.

취소하면 발송되지 않습니다.
계속하시겠습니까?`)) return;

      const statusEl = popup.querySelector(`.send-status-${key}`);
      btn.disabled = true; btn.textContent = '발송 중...';
      const ppBody = { templateCode: row.tpl, to: row.phone, variables: row.vars, pfId: row.pfId };
      const sentAt = nowStr();
      fetch('/api/send', {
        method: 'POST',
        headers: {'Content-Type':'application/json','x-api-token':API_AUTH_TOKEN},
        body: JSON.stringify(ppBody)
      }).then(res=>{
        if(res.ok){
          btn.textContent='✓ 완료'; btn.style.background='#E0F7F4'; btn.style.color='#00897B';
          if(statusEl){ statusEl.textContent='✓'; statusEl.style.color='#00897B'; }
          addSendLog(sc,{type: isScore?'score':'account', studentId: row.s.id, studentName: row.s.name, recipient: row.recipientLabel,
            phone: row.phone, month: mon||'-', week: wk||'-', status:'success', errorMsg:'', sentAt});
        } else {
          btn.textContent='✗ 실패'; btn.style.background='#FFEBEE'; btn.style.color='#E53935';
          btn.disabled=false;
          if(statusEl){ statusEl.textContent='✗'; statusEl.style.color='#E53935'; }
          addSendLog(sc,{type: isScore?'score':'account', studentId: row.s.id, studentName: row.s.name, recipient: row.recipientLabel,
            phone: row.phone, month: mon||'-', week: wk||'-', status:'fail', errorMsg: String(res.status), sentAt});
        }
      }).catch((e)=>{
        btn.textContent='✗ 오류'; btn.style.background='#FFEBEE'; btn.style.color='#E53935';
        btn.disabled=false;
        addSendLog(sc,{type: isScore?'score':'account', studentId: row.s.id, studentName: row.s.name, recipient: row.recipientLabel,
          phone: row.phone, month: mon||'-', week: wk||'-', status:'fail', errorMsg: e.message||'네트워크 오류', sentAt});
      });
    };
  });
}

// 학생 "삭제"는 실제로는 탈퇴 처리 — 성적 기록은 보존한 채 학생만 sc.withdrawnStudents로 이동.
// "탈퇴 학생" 게시판에서 사유 확인/복구/영구삭제 가능.
function openWithdrawStudent(sc, sid){
  const s = sc.students.find(x=>x.id===sid);
  if(!s) return;

  const popup = document.createElement('div');
  popup.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center';
  popup.className = 'withdraw-student-popup';
  popup.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:28px;max-width:420px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:17px;font-weight:800;color:#1A237E">🚪 ${esc(s.name)} 학생 탈퇴 처리</div>
        <button onclick="this.closest('.withdraw-student-popup').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9BA3AF">✕</button>
      </div>
      <div style="font-size:12.5px;color:#9BA3AF;line-height:1.6;margin-bottom:16px">학생 목록에서 제외되고 "탈퇴 학생" 게시판으로 이동합니다. 성적 기록은 그대로 보존되며, 언제든 복구할 수 있습니다.</div>
      <label style="display:block;font-size:11px;font-weight:700;color:#9BA3AF;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">탈퇴 사유 (선택)</label>
      <textarea id="wd-reason" rows="3" placeholder="예: 타 학원 이동, 성적 불만족, 거리 문제 등" style="width:100%;padding:10px 14px;border:1.5px solid #E8ECF0;border-radius:9px;font-size:13px;outline:none;font-family:inherit;resize:vertical"
        onfocus="this.style.borderColor='#1A237E'" onblur="this.style.borderColor='#E8ECF0'"></textarea>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button id="btn-wd-confirm" style="flex:1;padding:13px;background:#E53935;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">탈퇴 처리</button>
        <button onclick="this.closest('.withdraw-student-popup').remove()" style="padding:13px 20px;background:#F7F8FA;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit">취소</button>
      </div>
    </div>`;

  document.body.appendChild(popup);
  popup.onclick = e => { if(e.target===popup) popup.remove(); };

  document.getElementById('btn-wd-confirm').onclick = () => {
    const withdrawReason = document.getElementById('wd-reason').value.trim();
    sc.withdrawnStudents = sc.withdrawnStudents || [];
    sc.withdrawnStudents.push({ ...s, withdrawReason, withdrawnAt: nowStr() });
    sc.students = sc.students.filter(x=>x.id!==sid);
    saveDB();
    popup.remove();
    render();
  };
}

function openEditStudent(sc, sid){
  const s = sc.students.find(x=>x.id===sid);
  if(!s) return;

  const popup = document.createElement('div');
  popup.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center';
  popup.className = 'edit-student-popup';
  popup.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:28px;max-width:420px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <div style="font-size:17px;font-weight:800;color:#1A237E">✏️ 학생 정보 수정</div>
        <button onclick="this.closest('.edit-student-popup').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9BA3AF">✕</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div>
          <label style="display:block;font-size:11px;font-weight:700;color:#9BA3AF;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px">이름</label>
          <input id="edit-name" value="${esc(s.name)}" style="width:100%;padding:10px 14px;border:1.5px solid #E8ECF0;border-radius:9px;font-size:14px;outline:none;font-family:inherit"
            onfocus="this.style.borderColor='#1A237E'" onblur="this.style.borderColor='#E8ECF0'">
        </div>
        <div>
          <label style="display:block;font-size:11px;font-weight:700;color:#9BA3AF;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px">학생 ID <span style="color:#C4C9D4;font-weight:400;text-transform:none">(변경 불가)</span></label>
          <input value="${esc(s.id)}" disabled style="width:100%;padding:10px 14px;border:1.5px solid #F0F2F5;border-radius:9px;font-size:14px;background:#F7F8FA;color:#9BA3AF;font-family:monospace">
        </div>
        <div>
          <label style="display:block;font-size:11px;font-weight:700;color:#9BA3AF;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px">비밀번호 ${s.pwd?'':'<span style="color:#C4C9D4;font-weight:400;text-transform:none">(서버에 암호화 저장되어 조회 불가 — 바꿀 때만 입력)</span>'}</label>
          <input id="edit-pwd" value="${s.pwd?esc(s.pwd):''}" placeholder="변경하려면 새 비밀번호 입력 (비워두면 유지)" style="width:100%;padding:10px 14px;border:1.5px solid #E8ECF0;border-radius:9px;font-size:14px;outline:none;font-family:inherit"
            onfocus="this.style.borderColor='#1A237E'" onblur="this.style.borderColor='#E8ECF0'">
        </div>
        <div>
          <label style="display:block;font-size:11px;font-weight:700;color:#9BA3AF;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px">학생 전화번호</label>
          <input id="edit-phone" value="${esc(s.phone)}" placeholder="010-0000-0000" maxlength="13" oninput="autoHyphen(this)" style="width:100%;padding:10px 14px;border:1.5px solid #E8ECF0;border-radius:9px;font-size:14px;outline:none;font-family:inherit"
            onfocus="this.style.borderColor='#1A237E'" onblur="this.style.borderColor='#E8ECF0'">
        </div>
        <div>
          <label style="display:block;font-size:11px;font-weight:700;color:#9BA3AF;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px">학부모 전화번호</label>
          <input id="edit-pphone" value="${esc(s.parentPhone)}" placeholder="010-0000-0000" maxlength="13" oninput="autoHyphen(this)" style="width:100%;padding:10px 14px;border:1.5px solid #E8ECF0;border-radius:9px;font-size:14px;outline:none;font-family:inherit"
            onfocus="this.style.borderColor='#1A237E'" onblur="this.style.borderColor='#E8ECF0'">
        </div>
        <div>
          <label style="display:block;font-size:11px;font-weight:700;color:#9BA3AF;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px">구분</label>
          <select id="edit-type" style="width:100%;padding:10px 14px;border:1.5px solid #E8ECF0;border-radius:9px;font-size:14px;outline:none;font-family:inherit;background:#fff">
            <option value="regular" ${(s.type||'regular')==='regular'?'selected':''}>재학생</option>
            <option value="new" ${s.type==='new'?'selected':''}>신규생</option>
            <option value="transfer" ${s.type==='transfer'?'selected':''}>전입생</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:11px;font-weight:700;color:#9BA3AF;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px">수강계기</label>
          <input id="edit-reason" value="${esc(s.reason)||''}" placeholder="예: 블로그, 추천(선배)" style="width:100%;padding:10px 14px;border:1.5px solid #E8ECF0;border-radius:9px;font-size:14px;outline:none;font-family:inherit"
            onfocus="this.style.borderColor='#1A237E'" onblur="this.style.borderColor='#E8ECF0'">
        </div>
      </div>
      <div id="edit-msg" style="font-size:12px;min-height:18px;margin-top:10px"></div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button id="btn-edit-save" style="flex:1;padding:13px;background:#1A237E;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit"
          onmouseover="this.style.background='#121858'" onmouseout="this.style.background='#1A237E'">저장</button>
        <button onclick="this.closest('.edit-student-popup').remove()" style="padding:13px 20px;background:#F7F8FA;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit">취소</button>
      </div>
    </div>`;

  document.body.appendChild(popup);
  popup.onclick = e => { if(e.target===popup) popup.remove(); };

  document.getElementById('btn-edit-save').onclick = async () => {
    const name = document.getElementById('edit-name').value.trim();
    const pwd  = document.getElementById('edit-pwd').value.trim();
    const phone = document.getElementById('edit-phone').value.trim();
    const pphone = document.getElementById('edit-pphone').value.trim();
    const type = document.getElementById('edit-type').value;
    const reason = document.getElementById('edit-reason').value.trim();
    const msg = document.getElementById('edit-msg');
    const saveBtn = document.getElementById('btn-edit-save');

    if(!name){ msg.textContent='이름을 입력하세요'; msg.style.color='#E53935'; return; }
    if(pwd && pwd.length < 4){ msg.textContent='비밀번호는 4자 이상이어야 합니다'; msg.style.color='#E53935'; return; }

    saveBtn.disabled = true;
    if(pwd){
      const ok = await resetStudentPassword(sc, s, pwd);
      if(!ok){ saveBtn.disabled = false; return; }
    }
    s.name = name;
    s.phone = phone;
    s.parentPhone = pphone;
    s.type = type;
    s.reason = reason;
    saveDB();

    msg.textContent = '✓ 저장 완료!'; msg.style.color = '#00897B';
    setTimeout(()=>{ popup.remove(); render(); }, 600);
  };

function addLog(sc,mon,wk,count,thrRt,thrWt){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const entry={month:mon,week:wk,count,thrRt,thrWt,
    savedAt:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`};
  if(ST.serverAdminSession){
    sc.saveLogs=Array.isArray(sc.saveLogs)?sc.saveLogs:[];
    sc.saveLogs.push(entry);
    if(sc.saveLogs.length>200)sc.saveLogs=sc.saveLogs.slice(-200);
    fetch('/api/admin/append-save-log',{
      method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({schoolId:sc.id,entry})
    }).catch(e=>console.warn('저장 로그 서버 기록 실패(화면에는 반영됨):',e));
    return;
  }
  try{
    const key='oheng_logs_'+sc.id;
    const logs=JSON.parse(localStorage.getItem(key)||'[]');
    logs.push(entry);
    localStorage.setItem(key,JSON.stringify(logs.slice(-200)));
  }catch(e){console.warn('addLog 오류:',e);}
}
function getSaveLogs(sc){
  if(ST.serverAdminSession)return Array.isArray(sc.saveLogs)?sc.saveLogs:[];
  try{return JSON.parse(localStorage.getItem('oheng_logs_'+sc.id)||'[]');}
  catch(e){return [];}
}

function loadHtml2Canvas(){
  if(typeof html2canvas!=='undefined')return Promise.resolve(true);
  return new Promise(resolve=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=()=>resolve(true);
    s.onerror=()=>resolve(false);
    document.head.appendChild(s);
  });
}
async function saveReportImage(btn){
  const el=document.getElementById('report-capture');
  if(!el)return;
  const origText=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='이미지 준비 중...';}
  try{
    const ready=await loadHtml2Canvas();
    if(!ready||typeof html2canvas==='undefined')throw new Error('이미지 기능을 불러오지 못했습니다. 네트워크 상태를 확인해주세요.');
    if(btn)btn.textContent='이미지 생성 중...';
    const canvas=await html2canvas(el,{backgroundColor:'#F7F8FA',scale:2,useCORS:true,
      ignoreElements:node=>node.classList&&node.classList.contains('no-print')});
    const link=document.createElement('a');
    const label=`${ST.user?.name||'성적표'}_${ST.vMon||''}${ST.vWk||''}`.replace(/\s+/g,'');
    link.download=`${label}.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
  }catch(e){
    alert('이미지 생성에 실패했습니다: '+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent=origText;}
  }
}
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  const results=[];
  const firstCols=lines[0].split(',').map(s=>s.trim().toLowerCase());
  const hasHeader=firstCols.some(h=>['이름','name','학생'].includes(h));
  const dataLines=hasHeader?lines.slice(1):lines;
  dataLines.forEach(line=>{
    const cols=line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
    if(!cols[0])return;
    const typeMap={'재학':'regular','신규':'new','전입':'transfer'};
    results.push({name:cols[0]||'',phone:cols[1]||'',parentPhone:cols[2]||'',type:typeMap[cols[3]]||'regular'});
  });
  return results;
}

function autoHyphen(el){
  let v = el.value.replace(/[^0-9]/g,'');
  if(v.length <= 3) el.value = v;
  else if(v.length <= 7) el.value = v.slice(0,3)+'-'+v.slice(3);
  else el.value = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
}
