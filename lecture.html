<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OHENG 인강 — 오은실쌤과 함께하는 전국 온라인 영어</title>
<meta name="theme-color" content="#FF6B4A">
<script src="https://cdn.portone.io/v2/browser-sdk.js" async defer></script>
<style>
  :root{
    --navy:#171C2E; --navy-soft:#5C6478; --coral:#FF6B4A; --coral-dark:#E8552F;
    --gray:#6B7280; --border:#E7E5E1; --lightbg:#FAF8F5; --white:#FFFFFF;
    --pill-bg:#F4F4F5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  @media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth} }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;background:var(--white);color:var(--navy);min-height:100dvh}
  #app{min-height:100dvh;display:flex;flex-direction:column}
  a{color:inherit}

  /* ── 공용 네비게이션 ── */
  .navbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:64px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);z-index:20}
  .navbar .logo{display:flex;align-items:center;gap:5px;font-weight:900;font-size:18px;letter-spacing:-0.4px;cursor:pointer;white-space:nowrap}
  .navbar .logo .dot{width:7px;height:7px;border-radius:50%;background:var(--coral)}
  .navlinks{display:flex;align-items:center;gap:30px;font-size:14px;font-weight:600;color:var(--navy)}
  .navlinks a{text-decoration:none}
  .navlinks a:hover{color:var(--coral)}
  .navright{display:flex;align-items:center;gap:16px}
  .nav-textlink{background:none;border:none;font-size:13px;font-weight:600;color:var(--navy-soft);cursor:pointer;font-family:inherit;white-space:nowrap;padding:12px 4px;min-height:44px;display:inline-flex;align-items:center}
  .nav-textlink:hover{color:var(--navy)}
  .who{font-size:12.5px;color:var(--navy-soft);white-space:nowrap}
  @media (max-width:860px){ .navlinks{display:none} .navbar{padding:0 16px} }

  /* ── 버튼 ── */
  .btn{padding:12px 18px;min-height:44px;border-radius:9px;border:1.5px solid var(--border);background:var(--white);color:var(--navy);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn:hover{background:#F5F5F4}
  .btn-primary{background:var(--coral);border-color:var(--coral);color:#fff}
  .btn-primary:hover{background:var(--coral-dark)}
  .btn-primary:disabled{opacity:0.5;cursor:default}
  .btn-block{width:100%;padding:13px;font-size:14.5px;border-radius:10px}
  .link-btn{background:none;border:none;color:var(--navy-soft);font-size:12.5px;cursor:pointer;font-family:inherit;text-decoration:underline;padding:10px 2px;min-height:44px;display:inline-flex;align-items:center}
  .link-btn:hover{color:var(--navy)}
  .btn:focus-visible,.link-btn:focus-visible,.nav-textlink:focus-visible,a:focus-visible{outline:2.5px solid var(--coral);outline-offset:2px}
  .divider-or{display:flex;align-items:center;gap:10px;margin:14px 0;color:#B9BCC4;font-size:11.5px}
  .divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--border)}

  main{flex:1;width:100%}
  .app-main{max-width:640px;margin:0 auto;padding:24px 20px 60px;width:100%}

  /* ── 히어로 ── */
  .hero{display:flex;align-items:center;justify-content:center;gap:64px;padding:56px 24px;background:var(--lightbg)}
  .hero-inner{display:flex;align-items:center;gap:64px;max-width:1180px;width:100%}
  .hero-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
  .badge-pill{display:inline-flex;align-self:flex-start;padding:6px 13px;border-radius:20px;background:#FFE4DC;color:var(--coral-dark);font-size:12px;font-weight:700}
  .hero-title{font-size:38px;font-weight:900;letter-spacing:-1px;line-height:1.28}
  .hero-sub{font-size:14.5px;color:var(--navy-soft);line-height:1.6;max-width:480px}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap}
  .cta-row .btn{padding:14px 24px;font-size:14.5px;border-radius:10px}
  .stats-row{display:flex;gap:26px;padding-top:4px}
  .stat-n{font-size:18px;font-weight:900}
  .stat-l{font-size:11.5px;color:var(--navy-soft)}
  .hero-image{flex-shrink:0;width:360px;height:360px;border-radius:24px;background:linear-gradient(135deg,#E9E4FB,#FFD9C7);display:flex;align-items:center;justify-content:center;font-size:72px}
  @media (max-width:860px){
    .hero-inner{flex-direction:column;gap:28px;text-align:left}
    .hero-title{font-size:28px}
    .hero-image{width:100%;height:220px}
  }

  /* ── 신뢰 지표 바 ── */
  .trust-bar{background:var(--navy);padding:16px 24px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px 40px;font-size:12.5px;font-weight:600;color:#fff}

  /* ── 섹션 공용 ── */
  .section{padding:56px 24px}
  .section-inner{max-width:1180px;margin:0 auto}
  .section-head{text-align:center;margin-bottom:26px}
  .section-title{font-size:24px;font-weight:900;margin:0}
  .section-sub{font-size:13px;color:var(--navy-soft);margin-top:6px}
  .tabs{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--navy-soft)}
  .tab{font-weight:600}
  .tab.active{color:var(--coral);font-weight:800}
  .tabs .sep{color:var(--border)}

  /* ── 강좌 카드 ── */
  .course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:30px}
  .ccard{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff;transition:box-shadow .15s,transform .15s}
  .ccard:hover{box-shadow:0 12px 28px rgba(23,28,46,.08);transform:translateY(-2px)}
  .ccard-thumb{height:170px}
  .ccard-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:7px}
  .ccard-title{font-size:16px;font-weight:800}
  .ccard-meta{font-size:12px;color:var(--navy-soft)}
  .ccard-price{font-size:16px;font-weight:900;color:var(--coral)}
  .ccard .btn{margin-top:4px}
  .empty-courses{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--navy-soft);border:1.5px dashed var(--border);border-radius:16px}
  .empty-courses .ic{font-size:32px;margin-bottom:10px}

  /* ── 선생님 소개 ── */
  .instructor{background:var(--navy);color:#fff}
  .instructor .section-inner{display:flex;align-items:center;gap:56px}
  .instructor-photo{flex-shrink:0;width:260px;height:260px;border-radius:20px;background:linear-gradient(135deg,#3A4166,#232945);display:flex;align-items:center;justify-content:center;font-size:64px}
  .instructor-eyebrow{font-size:12px;font-weight:800;color:var(--coral);letter-spacing:.5px}
  .instructor-name{font-size:26px;font-weight:900;margin:8px 0 14px}
  .instructor-quote{font-size:14.5px;line-height:1.65;color:#C7C9D6;max-width:560px}
  .cred-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:#9498AA;font-weight:600}
  @media (max-width:860px){
    .instructor .section-inner{flex-direction:column;text-align:center;gap:22px}
    .cred-row{justify-content:center}
  }

  /* ── 수업 특징 ── */
  .feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:26px}
  .fcard{border:1px solid var(--border);border-radius:14px;padding:22px 20px;background:#fff}
  .fcard .ic{font-size:22px;margin-bottom:10px}
  .fcard h3{font-size:14.5px;font-weight:800;margin-bottom:6px}
  .fcard p{font-size:12.5px;line-height:1.6;color:var(--navy-soft)}

  /* ── 후기 ── */
  .review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:26px}
  .rcard-post{text-align:left}
  .rcard-post .body{white-space:pre-wrap}
  .rcard-author{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
  .rcard-author .badge{background:#FFE4DC;color:var(--coral-dark);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .rcard-author .who{color:var(--navy-soft);font-size:11.5px;margin-left:auto}
  .rcard-images{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .rcard-images img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
  .rcard-comments{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .rcard-comment{font-size:12.5px;margin-bottom:6px;line-height:1.5}
  .rcard-comment .badge{background:var(--lightbg);color:var(--navy-soft);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-right:4px}
  .rcard-comment-form{display:flex;gap:8px;margin-top:8px}
  .rcard-comment-form .finp{flex:1;margin:0}
  .review-write-form{border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:0;margin-bottom:20px;background:#fff}
  .review-write-form textarea.finp{resize:vertical}
  .review-login-cta{text-align:center;margin-bottom:20px}
  .navlinks button:hover{color:var(--coral)}
  .rcard{border:1px solid var(--border);border-radius:14px;padding:20px;background:#fff}
  .rcard .stars{color:var(--coral);font-size:12.5px;font-weight:700;margin-bottom:8px}
  .rcard .body{font-size:13.5px;line-height:1.6;margin-bottom:10px}
  .rcard .who{font-size:11.5px;color:var(--navy-soft);font-weight:600}

  /* ── 하단 CTA ── */
  .footer-cta{background:var(--coral);color:#fff;text-align:center;padding:60px 24px}
  .footer-cta h2{font-size:24px;font-weight:900;margin-bottom:20px}
  .footer-cta .btn{background:#fff;color:var(--coral-dark);border:none;padding:14px 30px;font-size:14.5px;border-radius:10px}
  .site-footer{background:#12162400;padding:20px 24px 32px;text-align:center;font-size:11.5px;color:#FFE4DC}
  .footer-cta .site-footer{background:transparent}

  /* ── 로그인/인증 카드 (앱 영역 공용) ── */
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .login-card{width:100%;max-width:360px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:32px 28px;box-shadow:0 8px 30px rgba(23,28,46,.05)}
  .login-title{font-size:19px;font-weight:900;margin-bottom:4px}
  .login-sub{font-size:12.5px;color:var(--navy-soft);margin-bottom:22px;line-height:1.5}
  .finp{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--navy);font-size:16px;font-family:inherit;margin-bottom:10px;outline:none}
  .finp:focus{border-color:var(--coral)}
  .login-err{font-size:12px;color:#E0473E;min-height:16px;margin-bottom:6px}
  .login-foot{margin-top:18px;text-align:center}

  /* ── 목록/재생 (로그인 후 앱) ── */
  .wk-head{font-size:12px;font-weight:800;color:var(--navy-soft);margin:22px 0 10px;letter-spacing:0.3px}
  .wk-head:first-child{margin-top:0}
  .vcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
  .vcard:hover{border-color:var(--coral)}
  .vcard-title{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .empty{text-align:center;padding:80px 20px;color:#A8ABB6}
  .empty .ic{font-size:38px;margin-bottom:14px}

  .player-back{background:none;border:none;color:var(--navy-soft);font-size:13px;cursor:pointer;margin-bottom:16px;font-family:inherit;display:flex;align-items:center;gap:6px}
  .player-back:hover{color:var(--navy)}
  .player-title{font-size:19px;font-weight:800;margin-bottom:4px}
  .player-wk{font-size:12.5px;color:var(--navy-soft);margin-bottom:20px}
  .player-box{background:var(--navy);border-radius:16px;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#8A93A8;text-align:center;padding:24px}
  .player-box .ic{font-size:34px}
  .player-box .msg{font-size:13.5px;color:#C7C9D6}
  .player-box .sub{font-size:11.5px;color:#7B819A}
  .vp-wrap{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .vp-wrap video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
  .vp-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#C7C9D6;font-size:13px;pointer-events:none}
  .vp-mark{position:absolute;z-index:2;color:#fff;opacity:.3;font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.7);transition:opacity .6s ease}
  .vp-bar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px}
  .vp-bar button{background:none;border:none;color:#fff;font-size:15px;line-height:1;cursor:pointer;padding:4px 6px;font-family:inherit}
  .vp-bar select{background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;font-size:11.5px;padding:3px 4px;font-family:inherit}
  .vp-seek{flex:1;min-width:60px;accent-color:var(--coral)}
  .vp-time{font-variant-numeric:tabular-nums;white-space:nowrap}
  .vp-wrap:fullscreen{border-radius:0;aspect-ratio:auto}
  .vp-wrap.vp-fake-fs{position:fixed;inset:0;z-index:1000;border-radius:0;aspect-ratio:auto}
  .vp-notice{margin-top:10px;font-size:12.5px;color:var(--navy-soft);line-height:1.55}
  .vcard-tag{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--lightbg);color:var(--navy-soft);white-space:nowrap}
  .vcard-tag+.vcard-tag{margin-left:6px}
  .vcard-tag.ended{background:#F1F3F5;color:#9BA3AF}
  .vcard-tag.done{background:#E0F2E9;color:#00695C}
  .vcard-tag.warn{background:#FFF3E0;color:#E65100}
  .wk-summary{background:linear-gradient(135deg,var(--navy),#2F3A7A);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:18px}
  .wk-summary .t{font-size:12px;opacity:.75;font-weight:700;letter-spacing:.5px;margin-bottom:6px}
  .wk-summary .row{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-top:8px}
  .wk-summary .bar{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
  .wk-summary .bar>div{height:100%;background:var(--coral);border-radius:3px}
  .wk-summary .pct{font-variant-numeric:tabular-nums;min-width:38px;text-align:right;font-weight:700}
  .vcard.ended{opacity:.6}
  @media (max-width:480px){ .vp-bar{gap:6px;padding:8px} #vp-mute{display:none} .vp-mark{font-size:10px} }
  @media (max-width:480px){ .who{display:none} }

  .loading{flex:1;display:flex;align-items:center;justify-content:center;color:#A8ABB6;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ST={screen:'loading',mode:null,student:null,member:null,videos:null,active:null,courses:null,otpPhone:''};

function esc(str){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const WEEKS=['1주','2주','3주','4주','5주'];
function moI(m){return MONTHS.indexOf(m)}
function wkI(w){return WEEKS.indexOf(w)}
function won(n){return (n||0).toLocaleString('ko-KR')+'원';}

/* ── 데이터 로드 ── */
async function checkStudentSession(){
  try{
    const res=await fetch('/api/auth/session',{credentials:'include'});
    if(!res.ok)return false;
    const d=await res.json();
    return d.success && d.role==='student';
  }catch(e){return false;}
}
async function loadStudentMe(){
  try{
    const res=await fetch('/api/student/me',{credentials:'include'});
    if(!res.ok)return null;
    const d=await res.json();
    return d.success?d:null;
  }catch(e){return null;}
}
async function loadStudentVideos(){
  try{
    const res=await fetch('/api/videos/mine',{credentials:'include'});
    const d=await res.json();
    return d.success?d.videos:[];
  }catch(e){return [];}
}
async function loadMemberMe(){
  try{
    const res=await fetch('/api/member-auth/me',{credentials:'include'});
    if(!res.ok)return null;
    const d=await res.json();
    return d.success?d.member:null;
  }catch(e){return null;}
}
async function loadMemberVideos(){
  try{
    const res=await fetch('/api/courses/mine',{credentials:'include'});
    const d=await res.json();
    return d.success?d.videos:[];
  }catch(e){return [];}
}
// 목록 뱃지용 — 보이는 영상 전체의 시청 상태를 한 번에.
async function loadWatchMap(videos){
  const ids=(videos||[]).map(v=>v.id);
  if(!ids.length)return{};
  try{
    const res=await fetch('/api/videos/watch-mine?videoIds='+encodeURIComponent(ids.join(',')),{credentials:'include'});
    const d=await res.json();
    return d.success?d.statuses:{};
  }catch(e){return{};}
}
async function loadPublicCourses(){
  try{
    const res=await fetch('/api/courses/list');
    const d=await res.json();
    return d.success?d.courses:[];
  }catch(e){return [];}
}

// 무료 강좌는 "신청하기"가, 유료 강좌는 "구매하기"가 로그인을 필요로 해서, 비로그인 상태로
// 누르면 어떤 강좌를 어떤 동작(신청/구매)으로 처리할지 기억해뒀다가 로그인(휴대폰 OTP든
// 구글 리다이렉트 왕복이든) 완료 직후 자동으로 이어서 처리한다.
function setPendingCourseAction(courseId,kind){ try{ sessionStorage.setItem('oheng_pending_course',JSON.stringify({courseId,kind})); }catch(e){} }
function takePendingCourseAction(){
  try{
    const raw=sessionStorage.getItem('oheng_pending_course');
    sessionStorage.removeItem('oheng_pending_course');
    return raw?JSON.parse(raw):null;
  }catch(e){ return null; }
}
async function tryAutoApply(){
  const pending=takePendingCourseAction();
  if(!pending)return;
  if(pending.kind==='purchase'){ await startCoursePayment(pending.courseId); return; }
  try{
    const res=await fetch('/api/courses/apply',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({courseId:pending.courseId})});
    const d=await res.json();
    if(d.success)alert('신청이 완료됐습니다! 확인 후 연락드릴게요.');
  }catch(e){}
}

// 포트원 SDK는 async defer로 불러오기 때문에, 로그인 리다이렉트 직후처럼 페이지가
// 막 뜬 시점엔 아직 안 실렸을 수 있어 최대 5초 정도 짧게 기다려준다.
function waitForPortOne(){
  return new Promise(resolve=>{
    if(window.PortOne){resolve(true);return;}
    let waited=0;
    const iv=setInterval(()=>{
      waited+=100;
      if(window.PortOne){clearInterval(iv);resolve(true);}
      else if(waited>=5000){clearInterval(iv);resolve(false);}
    },100);
  });
}

// 결제창 호출 → 서버 검증까지 한 번에. 실패해도 결제 자체는 포트원 쪽에 남아있으니
// 사용자에게 안내만 하고, 다음 로그인 때 다시 시도할 수 있게 강좌 목록으로 돌려보낸다.
async function startCoursePayment(courseId){
  try{
    if(!await waitForPortOne()){alert('결제 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.');return;}
    const res=await fetch('/api/courses/create-payment',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({courseId})});
    const d=await res.json();
    if(!d.success){alert(d.message||'결제 준비에 실패했습니다');return;}
    const p=d.payment;
    const payment=await PortOne.requestPayment({
      storeId:p.storeId, channelKey:p.channelKey, paymentId:p.paymentId,
      orderName:p.orderName, totalAmount:p.totalAmount, currency:p.currency,
      payMethod:'CARD',
    });
    if(payment.code!==undefined){
      alert('결제가 취소되었거나 실패했습니다'+(payment.message?': '+payment.message:''));
      return;
    }
    const completeRes=await fetch('/api/courses/complete-payment',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.paymentId})});
    const completeData=await completeRes.json();
    if(completeData.success){
      alert(`결제가 완료됐습니다! "${completeData.courseTitle}" 강좌를 바로 시청하실 수 있어요.`);
      ST.videos=await loadMemberVideos();ST.screen='list';render();
    }else{
      alert(completeData.message||'결제 확인에 실패했습니다. 잠시 후 다시 시도해주세요.');
    }
  }catch(e){
    alert('결제 중 오류가 발생했습니다.');
  }
}

async function boot(){
  const qs=new URLSearchParams(location.search);
  if(qs.has('google_error')){
    ST.googleError=qs.get('google_error');
    history.replaceState(null,'',location.pathname);
  }
  const studentOk=await checkStudentSession();
  if(studentOk){
    const me=await loadStudentMe();
    if(me){
      ST.mode='student';ST.student=me;ST.videos=await loadStudentVideos();ST.watch=await loadWatchMap(ST.videos);ST.screen='list';render();return;
    }
  }
  const member=await loadMemberMe();
  if(member){
    ST.mode='member';ST.member=member;
    if(!member.name){ST.screen='otp-name';render();return;}
    await tryAutoApply();
    ST.videos=await loadMemberVideos();ST.watch=await loadWatchMap(ST.videos);ST.screen='list';render();return;
  }
  ST.mode=null;
  ST.courses=await loadPublicCourses();
  ST.screen='browse';
  render();
}

async function doStudentLogin(id,pw,errEl,btn){
  errEl.textContent='';btn.disabled=true;btn.textContent='로그인 중...';
  try{
    const res=await fetch('/api/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'student',id,pw})});
    const d=await res.json();
    if(!d.success){errEl.textContent=d.message||'로그인 실패';btn.disabled=false;btn.textContent='로그인';return;}
    await boot();
  }catch(e){
    errEl.textContent='네트워크 오류';btn.disabled=false;btn.textContent='로그인';
  }
}

async function doOtpRequest(phone,errEl,btn){
  errEl.textContent='';
  const digits=phone.replace(/[^0-9]/g,'');
  if(digits.length<10){errEl.textContent='휴대폰 번호를 확인해주세요';return;}
  btn.disabled=true;btn.textContent='전송 중...';
  try{
    const res=await fetch('/api/member-auth/otp-request',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:digits})});
    const d=await res.json();
    btn.disabled=false;btn.textContent='인증번호 받기';
    if(!d.success){errEl.textContent=d.message||'전송 실패';return;}
    ST.otpPhone=digits;ST.screen='otp-code';render();
  }catch(e){
    errEl.textContent='네트워크 오류';btn.disabled=false;btn.textContent='인증번호 받기';
  }
}

async function doOtpVerify(code,errEl,btn){
  errEl.textContent='';
  if(!code.trim()){errEl.textContent='인증번호를 입력하세요';return;}
  btn.disabled=true;btn.textContent='확인 중...';
  try{
    const res=await fetch('/api/member-auth/otp-verify',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ST.otpPhone,code:code.trim()})});
    const d=await res.json();
    btn.disabled=false;btn.textContent='확인';
    if(!d.success){errEl.textContent=d.message||'인증 실패';return;}
    if(d.isNew || !d.name){ST.screen='otp-name';render();return;}
    ST.mode='member';
    ST.member=await loadMemberMe();
    await tryAutoApply();
    ST.videos=await loadMemberVideos();
    ST.screen='list';
    render();
  }catch(e){
    errEl.textContent='네트워크 오류';btn.disabled=false;btn.textContent='확인';
  }
}

async function doProfileSave(name,errEl,btn){
  errEl.textContent='';
  if(!name.trim()){errEl.textContent='이름을 입력하세요';return;}
  btn.disabled=true;btn.textContent='저장 중...';
  try{
    const res=await fetch('/api/member-auth/profile',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim()})});
    const d=await res.json();
    if(!d.success){errEl.textContent=d.message||'저장 실패';btn.disabled=false;btn.textContent='완료';return;}
    ST.mode='member';
    ST.member=await loadMemberMe();

    ST.screen='list';
    render();
  }catch(e){
    errEl.textContent='네트워크 오류';btn.disabled=false;btn.textContent='완료';
  }
}

function navLink(nav,label,active){
  return`<button class="nav-textlink" data-nav="${nav}" style="${active?'color:var(--coral);font-weight:800':''}">${label}</button>`;
}
function navBar(){

  const loggedIn=ST.mode==='student'||ST.mode==='member';
  const showLanding=ST.screen==='browse';
  // student-login/otp-* 같은 로그인 진행 화면에서는 이 버튼들의 클릭 핸들러를 wireBrowse()에서만

    ?`${navLink('list','내 강의실',ST.screen==='list'||ST.screen==='player')}${navLink('browse','강좌',ST.screen==='browse')}${navLink('reviews','후기',ST.screen==='reviews')}${ST.mode==='student'?navLink('report','성적표',false):''}<span class="who">${ST.mode==='student'?`${esc(ST.student?.student?.name||'')} · ${esc(ST.student?.school?.name||'')}`:`${esc(ST.member?.name||'')} · ${esc(ST.member?.phone||ST.member?.email||'')}`}</span><button class="btn" id="btn-logout">로그아웃</button>`
    :showLanding?`<button class="nav-textlink" id="nav-student-link">학생 로그인</button><button class="btn btn-primary" id="nav-cta">무료체험 신청</button>`:'';
  const links=showLanding
    ?`<div class="navlinks"><a href="#courses">강좌</a><a href="#instructor">선생님 소개</a><a href="#features">커리큘럼</a><button class="nav-textlink" id="nav-reviews-link" style="background:none;border:none;font:inherit;cursor:pointer;padding:0;color:inherit">실제 후기</button></div>`
    :'';
  return`<div class="navbar">

const COURSE_LEVELS=['초등','중등','고등/수능','특강'];
function courseThumbGrad(i){
  const set=[['#4C5FD5','#242A56'],['#FF8A5C','#D9432E'],['#2FB39E','#0F5A5A']];
  return set[i%set.length];
}
function courseCard(c,i){
  const[g1,g2]=courseThumbGrad(i);
  const thumbStyle=c.thumbnailUrl?`background:center/cover no-repeat url('${esc(c.thumbnailUrl)}')`:`background:linear-gradient(135deg,${g1},${g2})`;
  return`<div class="ccard">
    <div class="ccard-thumb" style="${thumbStyle};position:relative">${c.level?`<span style="position:absolute;top:12px;left:12px;background:rgba(23,28,46,.72);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px">${esc(c.level)}</span>`:''}</div>
    <div class="ccard-body">
      <div class="ccard-title">${esc(c.title)}</div>
      <div class="ccard-meta">${esc(c.description||'')||'영상 '+c.videoCount+'개'} · 수강기간 ${c.durationDays}일</div>
      <div class="ccard-price">${won(c.price)}</div>
      ${c.price>0
        ?`<button class="btn btn-primary btn-block" data-apply-course="${c.id}" data-course-kind="purchase"><span aria-hidden="true">💳</span>&nbsp;구매하기</button>`
        :`<button class="btn btn-primary btn-block" data-apply-course="${c.id}" data-course-kind="apply"><span aria-hidden="true">🙋</span>&nbsp;신청하기</button>`}
    </div>
  </div>`;
}

// 탭(레벨) + 강좌 그리드만 담당 — 탭 클릭 시 히어로 등 나머지 화면을 다시 그리지 않고
// 이 조각만 갱신해서 스크롤 위치가 안 튀게 한다.
function courseSectionHtml(){
  const all=ST.courses||[];
  const filtered=ST.levelFilter?all.filter(c=>c.level===ST.levelFilter):all;
  const tabs=['<span class="tab'+(!ST.levelFilter?' active':'')+'" data-level="">전체</span>']
    .concat(COURSE_LEVELS.map(l=>`<span class="tab${ST.levelFilter===l?' active':''}" data-level="${l}">${l}</span>`))
    .join('<span class="sep">·</span>');
  const grid=filtered.length
    ?filtered.map(courseCard).join('')
    :(all.length
      ?`<div class="empty-courses"><div class="ic" aria-hidden="true">🔍</div><div style="font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px">해당 레벨의 강좌가 아직 없습니다</div><div style="font-size:12.5px">다른 레벨을 선택해보세요</div></div>`
      :`<div class="empty-courses"><div class="ic" aria-hidden="true">🎬</div><div style="font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px">곧 새로운 강좌가 열립니다</div><div style="font-size:12.5px">무료체험을 신청하시면 개강 소식을 가장 먼저 알려드려요</div></div>`);
  return`<div class="tabs" id="course-tabs">${tabs}</div><div class="course-grid">${grid}</div>`;
}
function wireCourseSection(){
  document.querySelectorAll('#course-tabs [data-level]').forEach(t=>{
    t.addEventListener('click',()=>{
      ST.levelFilter=t.dataset.level||null;
      const wrap=document.getElementById('course-section-wrap');
      if(wrap)wrap.innerHTML=courseSectionHtml();
      wireCourseSection();
      document.querySelectorAll('[data-apply-course]').forEach(bindApplyBtn);
    });
  });
}
function bindApplyBtn(btn){
  btn.addEventListener('click',()=>{
    const kind=btn.dataset.courseKind||'apply';
    const courseId=btn.dataset.applyCourse;
    // 이미 로그인되어 있으면(학생/회원 둘 다 구매 가능, 무료 신청은 회원만) 로그인 화면으로
    // 돌아갈 필요 없이 바로 처리한다.
    if(ST.mode==='student'||ST.mode==='member'){
      if(kind==='purchase'){ startCoursePayment(courseId); return; }
      if(ST.mode==='member'){
        fetch('/api/courses/apply',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({courseId})})
          .then(r=>r.json()).then(d=>{ if(d.success)alert('신청이 완료됐습니다! 확인 후 연락드릴게요.'); else alert(d.message||'신청에 실패했습니다'); });
        return;
      }
    }
    setPendingCourseAction(courseId, kind);
    alert(kind==='purchase'
      ?'먼저 로그인해주세요 — 로그인/가입이 끝나면 바로 결제창이 열립니다.'
      :'먼저 로그인해주세요 — 로그인/가입이 끝나면 자동으로 신청됩니다.');
    goStart();
  });
}

function shortKDate(ymd){const[,m,d]=String(ymd).split('-');return`${Number(m)}월 ${Number(d)}일`;}

// 시청 기간 표시 — 서버가 계산해 준 availability를 그대로 쓴다(학생 기기 시계는 믿지 않음).
function videoAvailTag(v){
  if(v.availability==='upcoming'&&v.availableFrom)return`<span class="vcard-tag">${shortKDate(v.availableFrom)}부터</span>`;
  if(v.availability==='ended')return`<span class="vcard-tag ended">시청 기간 종료</span>`;
  if(v.availableUntil)return`<span class="vcard-tag">~${shortKDate(v.availableUntil)}까지</span>`;
  return'';
}

function watchBadge(v){
  const rec=(ST.watch||{})[v.id];
  if(rec?.status==='teacher_confirmed'||rec?.status==='auto_completed')return`<span class="vcard-tag done">완료</span>`;
  if(rec?.status==='exempt')return`<span class="vcard-tag">제외</span>`;
  const p=rec?.progress;
  if(p&&p.durationSec)return`<span class="vcard-tag">${Math.round((p.ratio||0)*100)}%</span>`;
  return`<span class="vcard-tag">미시청</span>`;
}
function videoCard(v){
  return`<div class="vcard${v.availability==='ended'?' ended':''}" data-vid="${v.id}">
    <div class="vcard-title">🎬 ${esc(v.title)}${v.availability==='ended'?videoAvailTag(v):watchBadge(v)+videoAvailTag(v)}</div>
  </div>`;
}
function weekSummaryHtml(list,label){
  const rows=list.map(v=>{
    const rec=(ST.watch||{})[v.id];
    const done=rec?.status==='teacher_confirmed'||rec?.status==='auto_completed';
    const pct=done?100:Math.round(((rec?.progress?.ratio)||0)*100);
    return`<div class="row"><span style="flex:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.title)}</span><div class="bar"><div style="width:${pct}%"></div></div><span class="pct">${done?'완료':pct+'%'}</span></div>`;
  }).join('');
  return`<div class="wk-summary"><div class="t">이번 주 · ${esc(label)}</div>${rows}</div>`;
}

function listScreen(){
  const videos=ST.videos||[];
  if(!videos.length){
    const msg=ST.mode==='member'?'아직 구매한 강좌가 없습니다':'아직 볼 수 있는 영상이 없습니다';
    const sub=ST.mode==='member'?'강좌를 구매하면 여기에 표시됩니다':'선생님이 영상을 등록하면 여기에 표시됩니다';
    return`<div class="empty"><div class="ic">🎬</div><div style="font-size:14px;font-weight:600;color:var(--navy);margin-bottom:6px">${msg}</div><div style="font-size:12.5px">${sub}</div></div>`;
  }
  if(ST.mode==='member'){
    const groups=[...new Set(videos.map(v=>v.courseTitle))];
    return groups.map(title=>{
      const list=videos.filter(v=>v.courseTitle===title);
      return`<div class="wk-head">${esc(title)} · ${list.length}개</div>${list.map(videoCard).join('')}`;
    }).join('');
  }
  const dated=videos.filter(v=>v.month&&v.week);
  const undated=videos.filter(v=>!(v.month&&v.week));
  const weekKeys=[...new Set(dated.map(v=>v.month+'_'+v.week))]
    .sort((a,b)=>{const[am,aw]=a.split('_'),[bm,bw]=b.split('_');return moI(bm)-moI(am)||wkI(bw)-wkI(aw);});
  const weekSections=weekKeys.map(wk=>{
    const[m,w]=wk.split('_');
    const list=dated.filter(v=>v.month===m&&v.week===w);
    return`<div class="wk-head">${m} ${w} · ${list.length}개</div>${list.map(videoCard).join('')}`;
  }).join('');
  const undatedSection=undated.length?`<div class="wk-head">기타 자료 · ${undated.length}개</div>${undated.map(videoCard).join('')}`:'';
  const latest=weekKeys[0];
  const summary=latest?weekSummaryHtml(dated.filter(v=>v.month+'_'+v.week===latest),latest.replace('_',' ')):'';
  return summary+weekSections+undatedSection;
}

function fmtTime(s){
  if(!isFinite(s)||s<0)return'0:00';
  s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  return(h?`${h}:${String(m).padStart(2,'0')}`:`${m}`)+':'+String(sec).padStart(2,'0');
}

async function fetchPlayUrl(videoId){
  const res=await fetch('/api/videos/play-url?videoId='+encodeURIComponent(videoId),{credentials:'include'});
  const d=await res.json().catch(()=>({}));
  if(!res.ok||!d.success)throw new Error(d.message||'영상을 불러오지 못했습니다');
  return d.url;
}

// render()가 화면을 통째로 갈아끼우기 전에 호출 — 워터마크 이동 타이머와 재생 중인 영상을 정리한다.
// 안 치우면 화면을 오갈 때마다 타이머가 쌓인다.
function teardownPlayer(){
  if(ST.vpProgressCleanup){const f=ST.vpProgressCleanup;ST.vpProgressCleanup=null;f();}
  if(ST.vpMarkTimer){clearInterval(ST.vpMarkTimer);ST.vpMarkTimer=null;}
  const video=document.getElementById('vp-video');
  if(video){video.pause();video.removeAttribute('src');video.load();}
}

function showPlayerError(msg){
  teardownPlayer();
  const wrap=document.getElementById('vp-wrap');
  if(wrap)wrap.outerHTML=playerStatusBox('⚠️',msg);
}

// 기본 controls를 쓰지 않는 이유: 다운로드·전체화면 버튼을 끄는 controlsList는 크롬 전용이라
// 사파리·아이폰에선 무시되고, 아이폰 기본 전체화면은 영상만 키워 워터마크가 사라진다.
function wirePlayer(){
  const video=document.getElementById('vp-video');
  if(!video)return;
  const videoId=ST.active.id;
  const wrap=document.getElementById('vp-wrap');
  const loading=document.getElementById('vp-loading');
  const mark=document.getElementById('vp-mark');
  const playBtn=document.getElementById('vp-play');
  const seek=document.getElementById('vp-seek');
  const timeEl=document.getElementById('vp-time');
  const muteBtn=document.getElementById('vp-mute');
  const speedSel=document.getElementById('vp-speed');
  const fsBtn=document.getElementById('vp-fs');
  let seeking=false,retried=false,resumeAt=0;
  const stillHere=()=>ST.screen==='player'&&ST.active?.id===videoId&&video.isConnected;

  // 실제 재생한 구간만 모은다 — 두 timeupdate 사이 간격이 배속 기준 1.5초를 넘으면(건너뛰기·되감기)
  // 구간이 끊겨 자동으로 빠진다. 15초마다, 일시정지·종료·화면 이탈 때 서버로 보낸다.
  let lastT=null,pending=[];
  const trackTime=()=>{
    const t=video.currentTime;if(!isFinite(t))return;
    if(lastT!==null){const d=t-lastT;if(d>0&&d<=1.5*(video.playbackRate||1)+0.25)pending.push([lastT,t]);}
    lastT=t;
  };
  const flushProgress=(leaving)=>{
    if(!pending.length||!video.duration||!isFinite(video.duration))return;
    const body=JSON.stringify({videoId,durationSec:Math.round(video.duration),segments:pending.map(([s,e])=>[Math.floor(s),Math.ceil(e)]),lastPositionSec:Math.floor(video.currentTime||0)});
    pending=[];
    if(leaving&&navigator.sendBeacon){navigator.sendBeacon('/api/videos/watch-progress',new Blob([body],{type:'application/json'}));return;}
    fetch('/api/videos/watch-progress',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body,keepalive:true})
      .then(r=>r.json()).then(d=>{if(d.success&&stillHere())renderWatchProgress(d.record);}).catch(()=>{});
  };
  video.addEventListener('timeupdate',trackTime);
  video.addEventListener('seeking',()=>{lastT=null;});
  video.addEventListener('pause',()=>flushProgress(false));
  video.addEventListener('ended',()=>flushProgress(false));
  const sendTimer=setInterval(()=>{if(!video.paused)flushProgress(false);},15000);
  const onVisibility=()=>{if(document.visibilityState==='hidden')flushProgress(true);};
  const onPageHide=()=>flushProgress(true);
  document.addEventListener('visibilitychange',onVisibility);
  window.addEventListener('pagehide',onPageHide);
  ST.vpProgressCleanup=()=>{clearInterval(sendTimer);document.removeEventListener('visibilitychange',onVisibility);window.removeEventListener('pagehide',onPageHide);flushProgress(true);};

  // 이어보기 + 현재 상태 표시. 영상 정보가 먼저 준비돼 있으면 바로 위치를 옮긴다.
  fetch('/api/videos/watch-mine?videoIds='+encodeURIComponent(videoId),{credentials:'include'})
    .then(r=>r.json()).then(d=>{
      if(!stillHere())return;
      const rec=d.success?d.statuses[videoId]:null;
      renderWatchProgress(rec);
      const p=rec?.progress;
      if(p&&p.lastPositionSec>5&&p.durationSec-p.lastPositionSec>10){
        if(video.readyState>=1)video.currentTime=p.lastPositionSec;else resumeAt=p.lastPositionSec;
      }
    }).catch(()=>{});

  wrap.addEventListener('contextmenu',e=>e.preventDefault());
  // 네 모서리만 돌아가며 표시 — 가운데로 튀지 않아 덜 거슬리고, 녹화본 테두리를 잘라내도 어느 한
  // 모서리는 남는다. 아래쪽은 컨트롤 막대에 가리지 않게 14% 띄운다.
  const CORNERS=[{top:'4%',left:'4%'},{top:'4%',right:'4%'},{bottom:'14%',left:'4%'},{bottom:'14%',right:'4%'}];
  let cornerIdx=Math.floor(Math.random()*CORNERS.length);
  const moveMark=()=>{
    const c=CORNERS[cornerIdx];
    cornerIdx=(cornerIdx+1+Math.floor(Math.random()*(CORNERS.length-1)))%CORNERS.length;
    mark.style.opacity='0';
    setTimeout(()=>{
      mark.style.top=c.top||'auto';mark.style.bottom=c.bottom||'auto';
      mark.style.left=c.left||'auto';mark.style.right=c.right||'auto';
      mark.style.opacity='';
    },600);
  };
  const c0=CORNERS[cornerIdx];
  mark.style.top=c0.top||'auto';mark.style.bottom=c0.bottom||'auto';mark.style.left=c0.left||'auto';mark.style.right=c0.right||'auto';
  ST.vpMarkTimer=setInterval(moveMark,30000);

  // 로딩 표시는 hidden 속성 대신 style로 숨긴다 — .vp-loading의 display:flex가 hidden을 덮어쓴다.
  const hideLoading=()=>{loading.style.display='none';};
  video.addEventListener('loadedmetadata',()=>{
    hideLoading();
    video.playbackRate=Number(speedSel.value)||1;
    if(resumeAt){video.currentTime=resumeAt;resumeAt=0;}
    timeEl.textContent=`${fmtTime(video.currentTime)} / ${fmtTime(video.duration)}`;
  });
  video.addEventListener('timeupdate',()=>{
    if(!seeking&&video.duration)seek.value=String(Math.round(video.currentTime/video.duration*1000));
    timeEl.textContent=`${fmtTime(video.currentTime)} / ${fmtTime(video.duration)}`;
  });
  video.addEventListener('play',()=>{hideLoading();playBtn.textContent='❚❚';playBtn.setAttribute('aria-label','일시정지');});
  video.addEventListener('pause',()=>{playBtn.textContent='▶';playBtn.setAttribute('aria-label','재생');});
  video.addEventListener('playing',()=>{retried=false;});
  // 임시 주소는 4시간 뒤 만료된다 — 화면을 오래 열어둬서 재생이 실패하면 한 번만 새 주소로 이어서 재생.
  video.addEventListener('error',async()=>{
    if(!video.getAttribute('src')||!stillHere())return;
    if(retried){showPlayerError('영상을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');return;}
    retried=true;
    resumeAt=video.currentTime||0;
    const wasPlaying=!video.paused;
    try{
      const url=await fetchPlayUrl(videoId);
      if(!stillHere())return;
      video.src=url;
      if(wasPlaying)video.play().catch(()=>{});
    }catch(e){if(stillHere())showPlayerError(e.message);}
  });

  playBtn.addEventListener('click',()=>{if(video.paused)video.play().catch(()=>{});else video.pause();});
  video.addEventListener('click',()=>playBtn.click());
  seek.addEventListener('input',()=>{seeking=true;});
  seek.addEventListener('change',()=>{if(video.duration)video.currentTime=Number(seek.value)/1000*video.duration;seeking=false;});
  muteBtn.addEventListener('click',()=>{video.muted=!video.muted;muteBtn.textContent=video.muted?'🔇':'🔊';});
  speedSel.addEventListener('change',()=>{video.playbackRate=Number(speedSel.value)||1;});
  // 영상이 아니라 재생기 영역(영상+워터마크)을 키워야 전체화면에서도 워터마크가 남는다.
  // 아이폰 사파리는 요소 전체화면을 지원하지 않아 화면을 꽉 채우는 CSS 모드로 대신한다.
  fsBtn.addEventListener('click',()=>{
    if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});return;}
    if(wrap.classList.contains('vp-fake-fs')){wrap.classList.remove('vp-fake-fs');return;}
    if(wrap.requestFullscreen)wrap.requestFullscreen().catch(()=>wrap.classList.add('vp-fake-fs'));
    else wrap.classList.add('vp-fake-fs');
  });

  // 화면이 열리는 즉시 주소를 받아둔다 — 재생 버튼을 누르면 기다림 없이 시작.
  // 아이폰 사파리는 누르기 전엔 영상 정보를 안 받는 경우가 있어, 주소를 받은 뒤엔 안내 문구로 바꾼다.
  fetchPlayUrl(videoId)
    .then(url=>{if(!stillHere())return;video.src=url;loading.textContent='재생 버튼을 눌러주세요';})
    .catch(e=>{if(stillHere())showPlayerError(e.message);});
}

// 자동 기록 표시 — "재생 기준"임을 문구에 남긴다. 선생님 정정값이 항상 우선.
function watchProgressHtml(rec){
  const box=(bg,bd,fg,text)=>`<div style="background:${bg};border:1px solid ${bd};border-radius:12px;padding:14px 16px;font-size:13px;color:${fg}">${text}</div>`;
  if(rec?.status==='teacher_confirmed')return box('#E0F2E9','#B9E4CE','#00695C','✓ 선생님 확인 완료');
  if(rec?.status==='exempt')return box('var(--lightbg)','var(--border)','var(--navy-soft)','선생님이 시청 제외로 처리한 영상이에요');
  if(rec?.status==='auto_completed')return box('#E0F2E9','#B9E4CE','#00695C','✓ 재생 완료 (90% 이상)');
  const p=rec?.progress;
  if(p&&p.durationSec)return box('var(--lightbg)','var(--border)','var(--navy-soft)',`재생 기준 ${Math.round((p.ratio||0)*100)}% 시청`);
  return'';
}
function renderWatchProgress(rec){
  const wrap=document.getElementById('watch-status-wrap');
  if(wrap)wrap.innerHTML=watchProgressHtml(rec);
}

async function loadReviews(){
  try{
    const res=await fetch('/api/courses/review-list');
    const d=await res.json();
    return d.success?d.reviews:[];
  }catch(e){return [];}
}

function reviewImagesHtml(images){
  if(!images||!images.length)return'';
  return`<div class="rcard-images">${images.map(u=>`<img src="${esc(u)}" alt="후기 이미지" loading="lazy">`).join('')}</div>`;
}

function reviewCommentsHtml(review){
  const comments=review.comments||[];
  const list=comments.map(c=>`<div class="rcard-comment"><span class="badge">${c.authorType==='teacher'?'선생님':'학생'}</span><b>${esc(c.authorName)}</b> ${esc(c.text)}</div>`).join('');
  const canWrite=ST.mode==='student';
  const form=canWrite
    ?`<div class="rcard-comment-form"><input class="finp" data-comment-input="${review.id}" placeholder="댓글을 입력하세요" maxlength="2000"><button class="btn" data-comment-submit="${review.id}">등록</button></div>`
    :'';
  return`<div class="rcard-comments">${list}${form}</div>`;
}

function reviewCardHtml(r){
  return`<div class="rcard rcard-post">
    <div class="rcard-author"><span class="badge">${r.authorType==='teacher'?'👩‍🏫 선생님':'🙋 학생'}</span><b>${esc(r.authorName)}</b><span class="who">${esc((r.createdAt||'').slice(0,10))}</span></div>
    <div class="body">${esc(r.text)}</div>
    ${reviewImagesHtml(r.images)}
    ${reviewCommentsHtml(r)}
  </div>`;
}

function reviewWriteFormHtml(){
  if(ST.mode!=='student')return`<div class="review-login-cta"><button class="btn btn-primary" id="btn-review-login">로그인하고 후기 남기기</button></div>`;
  return`<div class="review-write-form">
    <textarea class="finp" id="review-text" rows="4" maxlength="2000" placeholder="후기를 남겨주세요"></textarea>
    <input type="file" id="review-images" accept="image/*" multiple>
    <div id="review-write-msg" style="font-size:12px;margin-top:6px"></div>
    <button class="btn btn-primary" id="btn-review-submit">후기 등록</button>
  </div>`;
}

function reviewsScreen(){
  const reviews=ST.reviews||[];
  const grid=reviews.length
    ?`<div class="review-grid">${reviews.map(reviewCardHtml).join('')}</div>`
    :`<div class="empty"><div class="ic">💬</div><div style="font-size:14px;font-weight:600;color:var(--navy);margin-bottom:6px">아직 등록된 후기가 없습니다</div></div>`;
  return`<button class="player-back" id="btn-reviews-back">‹ 처음으로</button>
    <div class="player-title">실제 후기</div>
    ${reviewWriteFormHtml()}
    ${grid}`;
}

function readFileAsBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const result=reader.result;
      const comma=result.indexOf(',');
      resolve(comma>=0?result.slice(comma+1):result);
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function submitReview(){
  const btn=document.getElementById('btn-review-submit');
  const msg=document.getElementById('review-write-msg');
  const text=document.getElementById('review-text').value.trim();
  const files=[...(document.getElementById('review-images').files||[])].slice(0,6);
  if(!text){msg.textContent='후기 내용을 입력하세요';msg.style.color='#E53935';return;}
  for(const file of files){
    if(file.size>3*1024*1024){msg.textContent=`이미지는 3MB 이하만 업로드할 수 있습니다 (${file.name})`;msg.style.color='#E53935';btn.disabled=false;return;}
  }
  btn.disabled=true;msg.textContent='등록 중...';msg.style.color='';
  try{
    const images=[];
    for(const file of files){
      const dataBase64=await readFileAsBase64(file);
      const res=await fetch('/api/courses/review-image-upload',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,mimeType:file.type,dataBase64})});
      const d=await res.json();
      if(!d.success){msg.textContent=d.message||'이미지 업로드 실패';msg.style.color='#E53935';btn.disabled=false;return;}
      images.push(d.url);
    }
    const createRes=await fetch('/api/courses/review-create',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,images})});
    const createData=await createRes.json();
    if(!createData.success){msg.textContent=createData.message||'후기 등록 실패';msg.style.color='#E53935';btn.disabled=false;return;}
    ST.reviews=await loadReviews();render();
  }catch(e){
    msg.textContent='오류가 발생했습니다';msg.style.color='#E53935';btn.disabled=false;
  }
}

async function submitComment(reviewId){
  const input=document.querySelector(`[data-comment-input="${reviewId}"]`);
  const text=input.value.trim();
  if(!text)return;
  try{
    const res=await fetch('/api/courses/comment-create',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviewId,text})});
    const d=await res.json();
    if(d.success){ST.reviews=await loadReviews();render();}
    else alert(d.message||'댓글 등록에 실패했습니다');
  }catch(e){alert('오류가 발생했습니다');}
}

function wireReviews(){
  document.getElementById('nav-logo')?.addEventListener('click',()=>{window.scrollTo({top:0,behavior:'smooth'});});
  document.getElementById('btn-logout')?.addEventListener('click',doLogout);
  document.getElementById('btn-reviews-back').addEventListener('click',()=>{ST.screen='browse';render();});
  document.getElementById('btn-review-login')?.addEventListener('click',()=>{ST.screen='student-login';render();});
  document.getElementById('btn-review-submit')?.addEventListener('click',submitReview);
  document.querySelectorAll('[data-comment-submit]').forEach(btn=>{
    btn.addEventListener('click',()=>submitComment(btn.dataset.commentSubmit));
  });
}

function render(){
  teardownPlayer();
  const app=document.getElementById('app');
  if(ST.screen==='loading'){app.innerHTML='<div class="loading">불러오는 중...</div>';return;}
  if(ST.screen==='browse'){app.innerHTML=navBar()+`<main>${browseScreen()}</main>`;wireBrowse();return;}
  if(ST.screen==='reviews'){app.innerHTML=navBar()+`<main><div class="app-main">${reviewsScreen()}</div></main>`;wireReviews();return;}
  if(ST.screen==='otp-phone'){app.innerHTML=navBar()+otpPhoneScreen();wireOtpPhone();return;}
  if(ST.screen==='otp-code'){app.innerHTML=navBar()+otpCodeScreen();wireOtpCode();return;}
  if(ST.screen==='otp-name'){app.innerHTML=navBar()+otpNameScreen();wireOtpName();return;}
  if(ST.screen==='student-login'){app.innerHTML=navBar()+loginScreen();wireStudentLogin();return;}
  const body=ST.screen==='player'?playerScreen():listScreen();
  app.innerHTML=navBar()+`<main><div class="app-main">${body}</div></main>`;
  wireApp();
}

function goStart(){ST.screen='otp-phone';render();}

function wireBrowse(){
  document.getElementById('nav-logo').addEventListener('click',()=>{window.scrollTo({top:0,behavior:'smooth'});});
  // 이미 로그인된 상태로 "강좌 더보기"를 눌러 여기로 온 경우엔 nav-student-link/nav-cta 대신
  // btn-logout이 떠있으므로, 로그아웃 상태 전용 버튼들은 optional하게 묶는다.
  document.getElementById('nav-cta')?.addEventListener('click',goStart);
  document.getElementById('nav-student-link')?.addEventListener('click',()=>{ST.screen='student-login';render();});
  document.getElementById('nav-reviews-link')?.addEventListener('click',async()=>{ST.reviews=await loadReviews();ST.screen='reviews';render();});
  document.getElementById('btn-reviews-more')?.addEventListener('click',async()=>{ST.reviews=await loadReviews();ST.screen='reviews';render();});
  document.getElementById('btn-logout')?.addEventListener('click',doLogout);
  document.getElementById('btn-start').addEventListener('click',goStart);
  document.getElementById('btn-start-2').addEventListener('click',goStart);
  wireCourseSection();
  document.querySelectorAll('[data-apply-course]').forEach(bindApplyBtn);
}

function wireOtpPhone(){
  const phoneEl=document.getElementById('otp-phone');
  const btn=document.getElementById('otp-req-btn'),err=document.getElementById('otp-err');
  const submit=()=>doOtpRequest(phoneEl.value.trim(),err,btn);
  btn.onclick=submit;
  phoneEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  document.getElementById('btn-google').addEventListener('click',()=>{location.href='/api/member-auth/google-start';});
  document.getElementById('btn-back-browse').addEventListener('click',()=>{ST.screen='browse';render();});
}

function wireOtpCode(){
  const codeEl=document.getElementById('otp-code');
  const btn=document.getElementById('otp-verify-btn'),err=document.getElementById('otp-err');
  const submit=()=>doOtpVerify(codeEl.value.trim(),err,btn);
  btn.onclick=submit;
  codeEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  document.getElementById('btn-resend').addEventListener('click',()=>{ST.screen='otp-phone';render();});
}

function wireOtpName(){
  const nameEl=document.getElementById('otp-name');
  const btn=document.getElementById('otp-name-btn'),err=document.getElementById('otp-err');
  const submit=()=>doProfileSave(nameEl.value.trim(),err,btn);
  btn.onclick=submit;
  nameEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
}

function wireStudentLogin(){
  const idEl=document.getElementById('lg-id'),pwEl=document.getElementById('lg-pw');
  const btn=document.getElementById('lg-btn'),err=document.getElementById('lg-err');
  const submit=()=>doStudentLogin(idEl.value.trim(),pwEl.value,err,btn);
  btn.onclick=submit;
  pwEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  document.getElementById('btn-back-browse').addEventListener('click',()=>{ST.screen='browse';render();});
}

function wireApp(){
  document.getElementById('btn-logout')?.addEventListener('click',doLogout);
  document.getElementById('btn-back')?.addEventListener('click',async()=>{ST.watch=await loadWatchMap(ST.videos);ST.screen='list';ST.active=null;render();});
  if(ST.screen==='player'&&ST.active)wirePlayer();
  document.querySelectorAll('[data-vid]').forEach(card=>{
    card.addEventListener('click',()=>{
      const v=(ST.videos||[]).find(x=>x.id===card.dataset.vid);
      if(!v)return;
      ST.active=v;ST.screen='player';render();
    });
  });
}

// 상단 링크는 모든 화면에 뜨므로, 화면별 wire 함수마다 붙이지 않고 #app에서 한 번만 위임 처리한다.
function wireNavDelegation(){
  document.getElementById('app').addEventListener('click',async e=>{
    const t=e.target.closest('[data-nav]');
    if(!t)return;
    const nav=t.dataset.nav;
    if(nav==='list'){ST.videos=ST.mode==='member'?await loadMemberVideos():await loadStudentVideos();ST.watch=await loadWatchMap(ST.videos);ST.active=null;ST.screen='list';render();}
    else if(nav==='browse'){ST.courses=await loadPublicCourses();ST.screen='browse';render();}
    else if(nav==='reviews'){ST.reviews=await loadReviews();ST.screen='reviews';render();}
    else if(nav==='report'){location.href='/index.html';}
  });
}
wireNavDelegation();
boot();
</script>
