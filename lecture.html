<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OHENG 인강 — 오은실쌤과 함께하는 전국 온라인 영어</title>
<meta name="theme-color" content="#FF6B4A">
<style>
  :root{
    --navy:#171C2E; --navy-soft:#5C6478; --coral:#FF6B4A; --coral-dark:#E8552F;
    --gray:#6B7280; --border:#E7E5E1; --lightbg:#FAF8F5; --white:#FFFFFF;
    --pill-bg:#F4F4F5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;background:var(--white);color:var(--navy);min-height:100dvh}
  #app{min-height:100dvh;display:flex;flex-direction:column}
  a{color:inherit}

  /* ── 공용 네비게이션 ── */
  .navbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:64px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);z-index:20}
  .navbar .logo{display:flex;align-items:center;gap:5px;font-weight:900;font-size:18px;letter-spacing:-0.4px;cursor:pointer;white-space:nowrap}
  .navbar .logo .dot{width:7px;height:7px;border-radius:50%;background:var(--coral)}
  .navlinks{display:flex;align-items:center;gap:30px;font-size:14px;font-weight:600;color:var(--navy)}
  .navlinks a{text-decoration:none}
  .navlinks a:hover{color:var(--coral)}
  .navright{display:flex;align-items:center;gap:16px}
  .nav-textlink{background:none;border:none;font-size:13px;font-weight:600;color:var(--navy-soft);cursor:pointer;font-family:inherit;white-space:nowrap}
  .nav-textlink:hover{color:var(--navy)}
  .who{font-size:12.5px;color:var(--navy-soft);white-space:nowrap}
  @media (max-width:860px){ .navlinks{display:none} .navbar{padding:0 16px} }

  /* ── 버튼 ── */
  .btn{padding:9px 16px;border-radius:9px;border:1.5px solid var(--border);background:var(--white);color:var(--navy);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn:hover{background:#F5F5F4}
  .btn-primary{background:var(--coral);border-color:var(--coral);color:#fff}
  .btn-primary:hover{background:var(--coral-dark)}
  .btn-primary:disabled{opacity:0.5;cursor:default}
  .btn-block{width:100%;padding:13px;font-size:14.5px;border-radius:10px}
  .link-btn{background:none;border:none;color:var(--navy-soft);font-size:12.5px;cursor:pointer;font-family:inherit;text-decoration:underline}
  .link-btn:hover{color:var(--navy)}
  .divider-or{display:flex;align-items:center;gap:10px;margin:14px 0;color:#B9BCC4;font-size:11.5px}
  .divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--border)}

  main{flex:1;width:100%}
  .app-main{max-width:640px;margin:0 auto;padding:24px 20px 60px;width:100%}

  /* ── 히어로 ── */
  .hero{display:flex;align-items:center;justify-content:center;gap:64px;padding:56px 24px;background:var(--lightbg)}
  .hero-inner{display:flex;align-items:center;gap:64px;max-width:1180px;width:100%}
  .hero-left{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
  .badge-pill{display:inline-flex;align-self:flex-start;padding:6px 13px;border-radius:20px;background:#FFE4DC;color:var(--coral-dark);font-size:12px;font-weight:700}
  .hero-title{font-size:38px;font-weight:900;letter-spacing:-1px;line-height:1.28}
  .hero-sub{font-size:14.5px;color:var(--navy-soft);line-height:1.6;max-width:480px}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap}
  .cta-row .btn{padding:14px 24px;font-size:14.5px;border-radius:10px}
  .stats-row{display:flex;gap:26px;padding-top:4px}
  .stat-n{font-size:18px;font-weight:900}
  .stat-l{font-size:11.5px;color:var(--navy-soft)}
  .hero-image{flex-shrink:0;width:360px;height:360px;border-radius:24px;background:linear-gradient(135deg,#E9E4FB,#FFD9C7);display:flex;align-items:center;justify-content:center;font-size:72px}
  @media (max-width:860px){
    .hero-inner{flex-direction:column;gap:28px;text-align:left}
    .hero-title{font-size:28px}
    .hero-image{width:100%;height:220px}
  }

  /* ── 신뢰 지표 바 ── */
  .trust-bar{background:var(--navy);padding:16px 24px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px 40px;font-size:12.5px;font-weight:600;color:#fff}

  /* ── 섹션 공용 ── */
  .section{padding:56px 24px}
  .section-inner{max-width:1180px;margin:0 auto}
  .section-head{text-align:center;margin-bottom:26px}
  .section-title{font-size:24px;font-weight:900}
  .section-sub{font-size:13px;color:var(--navy-soft);margin-top:6px}
  .tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:22px}
  .tab{padding:9px 18px;border-radius:20px;background:var(--pill-bg);color:var(--navy);font-size:13px;font-weight:700}
  .tab.active{background:var(--coral);color:#fff}

  /* ── 강좌 카드 ── */
  .course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:30px}
  .ccard{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff;transition:box-shadow .15s,transform .15s}
  .ccard:hover{box-shadow:0 12px 28px rgba(23,28,46,.08);transform:translateY(-2px)}
  .ccard-thumb{height:170px;position:relative;display:flex;align-items:flex-end;padding:14px;font-size:34px}
  .ccard-badge{position:absolute;top:14px;left:14px;padding:4px 10px;border-radius:6px;font-size:10.5px;font-weight:800;color:#fff}
  .ccard-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:7px}
  .ccard-title{font-size:16px;font-weight:800}
  .ccard-meta{font-size:12px;color:var(--navy-soft)}
  .ccard-price{font-size:16px;font-weight:900;color:var(--coral)}
  .ccard .btn{margin-top:4px}
  .empty-courses{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--navy-soft);border:1.5px dashed var(--border);border-radius:16px}
  .empty-courses .ic{font-size:32px;margin-bottom:10px}

  /* ── 원장님 소개 ── */
  .instructor{background:var(--navy);color:#fff}
  .instructor .section-inner{display:flex;align-items:center;gap:56px}
  .instructor-photo{flex-shrink:0;width:260px;height:260px;border-radius:20px;background:linear-gradient(135deg,#3A4166,#232945);display:flex;align-items:center;justify-content:center;font-size:64px}
  .instructor-eyebrow{font-size:12px;font-weight:800;color:var(--coral);letter-spacing:.5px}
  .instructor-name{font-size:26px;font-weight:900;margin:8px 0 14px}
  .instructor-quote{font-size:14.5px;line-height:1.65;color:#C7C9D6;max-width:560px}
  .cred-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:#9498AA;font-weight:600}
  @media (max-width:860px){
    .instructor .section-inner{flex-direction:column;text-align:center;gap:22px}
    .cred-row{justify-content:center}
  }

  /* ── 후기 ── */
  .review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:26px}
  .rcard{border:1px solid var(--border);border-radius:14px;padding:20px;background:#fff}
  .rcard .stars{color:var(--coral);font-size:12.5px;font-weight:700;margin-bottom:8px}
  .rcard .body{font-size:13.5px;line-height:1.6;margin-bottom:10px}
  .rcard .who{font-size:11.5px;color:var(--navy-soft);font-weight:600}

  /* ── 하단 CTA ── */
  .footer-cta{background:var(--coral);color:#fff;text-align:center;padding:60px 24px}
  .footer-cta h2{font-size:24px;font-weight:900;margin-bottom:20px}
  .footer-cta .btn{background:#fff;color:var(--coral-dark);border:none;padding:14px 30px;font-size:14.5px;border-radius:10px}
  .site-footer{background:#12162400;padding:20px 24px 32px;text-align:center;font-size:11.5px;color:#FFE4DC}
  .footer-cta .site-footer{background:transparent}

  /* ── 로그인/인증 카드 (앱 영역 공용) ── */
  .login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
  .login-card{width:100%;max-width:360px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:32px 28px;box-shadow:0 8px 30px rgba(23,28,46,.05)}
  .login-title{font-size:19px;font-weight:900;margin-bottom:4px}
  .login-sub{font-size:12.5px;color:var(--navy-soft);margin-bottom:22px;line-height:1.5}
  .finp{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;color:var(--navy);font-size:14px;font-family:inherit;margin-bottom:10px;outline:none}
  .finp:focus{border-color:var(--coral)}
  .login-err{font-size:12px;color:#E0473E;min-height:16px;margin-bottom:6px}
  .login-foot{margin-top:18px;text-align:center}

  /* ── 목록/재생 (로그인 후 앱) ── */
  .wk-head{font-size:12px;font-weight:800;color:var(--navy-soft);margin:22px 0 10px;letter-spacing:0.3px}
  .wk-head:first-child{margin-top:0}
  .vcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
  .vcard:hover{border-color:var(--coral)}
  .vcard-title{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .empty{text-align:center;padding:80px 20px;color:#A8ABB6}
  .empty .ic{font-size:38px;margin-bottom:14px}

  .player-back{background:none;border:none;color:var(--navy-soft);font-size:13px;cursor:pointer;margin-bottom:16px;font-family:inherit;display:flex;align-items:center;gap:6px}
  .player-back:hover{color:var(--navy)}
  .player-title{font-size:19px;font-weight:800;margin-bottom:4px}
  .player-wk{font-size:12.5px;color:var(--navy-soft);margin-bottom:20px}
  .player-box{background:var(--navy);border-radius:16px;aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#8A93A8;text-align:center;padding:24px}
  .player-box .ic{font-size:34px}
  .player-box .msg{font-size:13.5px;color:#C7C9D6}
  .player-box .sub{font-size:11.5px;color:#7B819A}

  .loading{flex:1;display:flex;align-items:center;justify-content:center;color:#A8ABB6;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ST={screen:'loading',mode:null,student:null,member:null,videos:null,active:null,courses:null,otpPhone:''};

function esc(str){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const WEEKS=['1주','2주','3주','4주','5주'];
function moI(m){return MONTHS.indexOf(m)}
function wkI(w){return WEEKS.indexOf(w)}
function won(n){return (n||0).toLocaleString('ko-KR')+'원';}

/* ── 데이터 로드 ── */
async function checkStudentSession(){
  try{
    const res=await fetch('/api/auth/session',{credentials:'include'});
    if(!res.ok)return false;
    const d=await res.json();
    return d.success && d.role==='student';
  }catch(e){return false;}
}
async function loadStudentMe(){
  try{
    const res=await fetch('/api/student/me',{credentials:'include'});
    if(!res.ok)return null;
    const d=await res.json();
    return d.success?d:null;
  }catch(e){return null;}
}
async function loadStudentVideos(){
  try{
    const res=await fetch('/api/videos/mine',{credentials:'include'});
    const d=await res.json();
    return d.success?d.videos:[];
  }catch(e){return [];}
}
async function loadMemberMe(){
  try{
    const res=await fetch('/api/member-auth/me',{credentials:'include'});
    if(!res.ok)return null;
    const d=await res.json();
    return d.success?d.member:null;
  }catch(e){return null;}
}
async function loadMemberVideos(){
  try{
    const res=await fetch('/api/courses/mine',{credentials:'include'});
    const d=await res.json();
    return d.success?d.videos:[];
  }catch(e){return [];}
}
async function loadPublicCourses(){
  try{
    const res=await fetch('/api/courses/list');
    const d=await res.json();
    return d.success?d.courses:[];
  }catch(e){return [];}
}

// 결제 연동 전까지 "신청하기"는 로그인이 필요해서, 비로그인 상태로 누르면 신청할 강좌를
// 기억해뒀다가 로그인(휴대폰 OTP든 구글 리다이렉트 왕복이든) 완료 직후 자동으로 신청 처리한다.
function setPendingApply(courseId){ try{ sessionStorage.setItem('oheng_pending_apply',courseId); }catch(e){} }
function takePendingApply(){
  try{
    const id=sessionStorage.getItem('oheng_pending_apply');
    sessionStorage.removeItem('oheng_pending_apply');
    return id;
  }catch(e){ return null; }
}
async function tryAutoApply(){
  const courseId=takePendingApply();
  if(!courseId)return;
  try{
    const res=await fetch('/api/courses/apply',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({courseId})});
    const d=await res.json();
    if(d.success)alert('신청이 완료됐습니다! 확인 후 연락드릴게요.');
  }catch(e){}
}

async function boot(){
  const qs=new URLSearchParams(location.search);
  if(qs.has('google_error')){
    ST.googleError=qs.get('google_error');
    history.replaceState(null,'',location.pathname);
  }
  const studentOk=await checkStudentSession();
  if(studentOk){
    const me=await loadStudentMe();
    if(me){
      ST.mode='student';ST.student=me;ST.videos=await loadStudentVideos();ST.screen='list';render();return;
    }
  }
  const member=await loadMemberMe();
  if(member){
    ST.mode='member';ST.member=member;
    if(!member.name){ST.screen='otp-name';render();return;}
    await tryAutoApply();
    ST.videos=await loadMemberVideos();ST.screen='list';render();return;
  }
  ST.mode=null;
  ST.courses=await loadPublicCourses();
  ST.screen='browse';
  render();
}

/* ── 액션 ── */
async function doStudentLogin(id,pw,errEl,btn){
  errEl.textContent='';btn.disabled=true;btn.textContent='로그인 중...';
  try{
    const res=await fetch('/api/auth/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'student',id,pw})});
    const d=await res.json();
    if(!d.success){errEl.textContent=d.message||'로그인 실패';btn.disabled=false;btn.textContent='로그인';return;}
    await boot();
  }catch(e){
    errEl.textContent='네트워크 오류';btn.disabled=false;btn.textContent='로그인';
  }
}

async function doOtpRequest(phone,errEl,btn){
  errEl.textContent='';
  const digits=phone.replace(/[^0-9]/g,'');
  if(digits.length<10){errEl.textContent='휴대폰 번호를 확인해주세요';return;}
  btn.disabled=true;btn.textContent='전송 중...';
  try{
    const res=await fetch('/api/member-auth/otp-request',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:digits})});
    const d=await res.json();
    btn.disabled=false;btn.textContent='인증번호 받기';
    if(!d.success){errEl.textContent=d.message||'전송 실패';return;}
    ST.otpPhone=digits;ST.screen='otp-code';render();
  }catch(e){
    errEl.textContent='네트워크 오류';btn.disabled=false;btn.textContent='인증번호 받기';
  }
}

async function doOtpVerify(code,errEl,btn){
  errEl.textContent='';
  if(!code.trim()){errEl.textContent='인증번호를 입력하세요';return;}
  btn.disabled=true;btn.textContent='확인 중...';
  try{
    const res=await fetch('/api/member-auth/otp-verify',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ST.otpPhone,code:code.trim()})});
    const d=await res.json();
    btn.disabled=false;btn.textContent='확인';
    if(!d.success){errEl.textContent=d.message||'인증 실패';return;}
    if(d.isNew || !d.name){ST.screen='otp-name';render();return;}
    ST.mode='member';
    ST.member=await loadMemberMe();
    await tryAutoApply();
    ST.videos=await loadMemberVideos();
    ST.screen='list';
    render();
  }catch(e){
    errEl.textContent='네트워크 오류';btn.disabled=false;btn.textContent='확인';
  }
}

async function doProfileSave(name,errEl,btn){
  errEl.textContent='';
  if(!name.trim()){errEl.textContent='이름을 입력하세요';return;}
  btn.disabled=true;btn.textContent='저장 중...';
  try{
    const res=await fetch('/api/member-auth/profile',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim()})});
    const d=await res.json();
    if(!d.success){errEl.textContent=d.message||'저장 실패';btn.disabled=false;btn.textContent='완료';return;}
    ST.mode='member';
    ST.member=await loadMemberMe();
    await tryAutoApply();
    ST.videos=await loadMemberVideos();
    ST.screen='list';
    render();
  }catch(e){
    errEl.textContent='네트워크 오류';btn.disabled=false;btn.textContent='완료';
  }
}

async function doLogout(){
  const url=ST.mode==='student'?'/api/auth/logout':'/api/member-auth/logout';
  fetch(url,{method:'POST',credentials:'include'}).catch(()=>{});
  ST.mode=null;ST.student=null;ST.member=null;ST.videos=null;ST.active=null;
  ST.courses=await loadPublicCourses();
  ST.screen='browse';
  render();
}

/* ── 화면 ── */
function navBar(){
  const loggedIn=['list','player'].includes(ST.screen) && (ST.mode==='student'||ST.mode==='member');
  const showLanding=ST.screen==='browse';
  const right=loggedIn
    ?`<span class="who">${ST.mode==='student'?`${esc(ST.student?.student?.name||'')} · ${esc(ST.student?.school?.name||'')}`:`${esc(ST.member?.name||'')} · ${esc(ST.member?.phone||ST.member?.email||'')}`}</span><button class="btn" id="btn-logout">로그아웃</button>`
    :`<button class="nav-textlink" id="nav-student-link">학생 로그인</button><button class="btn btn-primary" id="nav-cta">무료체험 신청</button>`;
  const links=showLanding
    ?`<div class="navlinks"><a href="#courses">강좌</a><a href="#instructor">원장님 소개</a><a href="#reviews">합격 후기</a></div>`
    :'';
  return`<div class="navbar">
    <div class="logo" id="nav-logo">OHENG<span class="dot"></span></div>
    ${links}
    <div class="navright">${right}</div>
  </div>`;
}

function courseBadge(i){
  const set=[['BEST','#FF6B4A'],['NEW','#2A9D8F'],['인기','#8B5CF6']];
  return set[i%set.length];
}
function courseThumbGrad(i){
  const set=[['#4C5FD5','#242A56'],['#FF8A5C','#D9432E'],['#2FB39E','#0F5A5A']];
  return set[i%set.length];
}
function courseCard(c,i){
  const[badge,badgeColor]=courseBadge(i);
  const[g1,g2]=courseThumbGrad(i);
  return`<div class="ccard">
    <div class="ccard-thumb" style="background:linear-gradient(135deg,${g1},${g2})">
      <span class="ccard-badge" style="background:${badgeColor}">${badge}</span>
    </div>
    <div class="ccard-body">
      <div class="ccard-title">${esc(c.title)}</div>
      <div class="ccard-meta">${esc(c.description||'')||'영상 '+c.videoCount+'개'} · 수강기간 ${c.durationDays}일</div>
      <div class="ccard-price">${won(c.price)}</div>
      <button class="btn btn-primary btn-block" data-apply-course="${c.id}">🙋 신청하기</button>
    </div>
  </div>`;
}

function browseScreen(){
  const courses=ST.courses||[];
  const grid=courses.length
    ?courses.map(courseCard).join('')

          <div class="rcard"><div class="stars">★★★★★</div><div class="body">아이가 스스로 강의를 찾아 들을 정도로 몰입도가 좋아요.</div><div class="who">중3 학부모 · 창원</div></div>

function otpPhoneScreen(){
  return`<div class="login-wrap">
    <div class="login-card">
      <div class="login-title">휴대폰 인증</div>
      <div class="login-sub">인증번호를 받을 번호를 입력하세요</div>
      <input class="finp" id="otp-phone" placeholder="01012345678" inputmode="numeric" autocomplete="tel">
      <div class="login-err" id="otp-err"></div>

      <div class="divider-or">또는</div>
      <button class="btn btn-block" id="btn-google">Google로 계속하기</button>
      <div class="login-foot"><button class="link-btn" id="btn-back-browse">‹ 뒤로</button></div>

function otpCodeScreen(){
  return`<div class="login-wrap">
    <div class="login-card">
      <div class="login-title">인증번호 입력</div>
      <div class="login-sub">${esc(ST.otpPhone)}로 전송된 6자리 번호를 입력하세요</div>
      <input class="finp" id="otp-code" placeholder="123456" inputmode="numeric" maxlength="6">

function otpNameScreen(){
  return`<div class="login-wrap">
    <div class="login-card">
      <div class="login-title">이름을 알려주세요</div>
      <div class="login-sub">마지막 단계예요</div>
      <input class="finp" id="otp-name" placeholder="이름">
      <div class="login-err" id="otp-err"></div>
      <button class="btn btn-primary btn-block" id="otp-name-btn">완료</button>

}

function loginScreen(){
  return`<div class="login-wrap">
    <div class="login-card">
      <div class="login-title">학생 로그인</div>
      <div class="login-sub">학원에서 발급받은 계정으로 로그인하세요</div>
      <input class="finp" id="lg-id" placeholder="학생 ID" autocomplete="username">
      <input class="finp" id="lg-pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <div class="login-err" id="lg-err"></div>
      <button class="btn btn-primary btn-block" id="lg-btn">로그인</button>
      <div class="login-foot"><button class="link-btn" id="btn-back-browse">‹ 뒤로</button></div>
    </div>
  </div>`;
}

function videoCard(v){
  return`<div class="vcard" data-vid="${v.id}">
    <div class="vcard-title">🎬 ${esc(v.title)}</div>
  </div>`;
}

function listScreen(){
  const videos=ST.videos||[];
  if(!videos.length){
    const msg=ST.mode==='member'?'아직 구매한 강좌가 없습니다':'아직 볼 수 있는 영상이 없습니다';
    const sub=ST.mode==='member'?'강좌를 구매하면 여기에 표시됩니다':'선생님이 영상을 등록하면 여기에 표시됩니다';
    return`<div class="empty"><div class="ic">🎬</div><div style="font-size:14px;font-weight:600;color:var(--navy);margin-bottom:6px">${msg}</div><div style="font-size:12.5px">${sub}</div></div>`;
  }
  if(ST.mode==='member'){
    const groups=[...new Set(videos.map(v=>v.courseTitle))];
    return groups.map(title=>{
      const list=videos.filter(v=>v.courseTitle===title);
      return`<div class="wk-head">${esc(title)} · ${list.length}개</div>${list.map(videoCard).join('')}`;
    }).join('');
  }
  const dated=videos.filter(v=>v.month&&v.week);
  const undated=videos.filter(v=>!(v.month&&v.week));
  const weekKeys=[...new Set(dated.map(v=>v.month+'_'+v.week))]
    .sort((a,b)=>{const[am,aw]=a.split('_'),[bm,bw]=b.split('_');return moI(bm)-moI(am)||wkI(bw)-wkI(aw);});
  const weekSections=weekKeys.map(wk=>{
    const[m,w]=wk.split('_');
    const list=dated.filter(v=>v.month===m&&v.week===w);
    return`<div class="wk-head">${m} ${w} · ${list.length}개</div>${list.map(videoCard).join('')}`;
  }).join('');
  const undatedSection=undated.length?`<div class="wk-head">기타 자료 · ${undated.length}개</div>${undated.map(videoCard).join('')}`:'';
  return weekSections+undatedSection;
}

function playerScreen(){
  const v=ST.active;
  const wk=ST.mode==='member'?(v.courseTitle||'강좌'):(v.month&&v.week?`${v.month} ${v.week}`:'기타 자료');
  return`<button class="player-back" id="btn-back">‹ 목록으로</button>
    <div class="player-title">${esc(v.title)}</div>
    <div class="player-wk">${esc(wk)}</div>
    <div class="player-box">
      <div class="ic">🔒</div>
      <div class="msg">재생 준비 중</div>
      <div class="sub">콜러스(Kollus) 연동 후 이곳에서 바로 재생됩니다</div>
    </div>`;
}

function render(){
  const app=document.getElementById('app');
  if(ST.screen==='loading'){app.innerHTML='<div class="loading">불러오는 중...</div>';return;}
  if(ST.screen==='browse'){app.innerHTML=navBar()+`<main>${browseScreen()}</main>`;wireBrowse();return;}
  if(ST.screen==='otp-phone'){app.innerHTML=navBar()+otpPhoneScreen();wireOtpPhone();return;}
  if(ST.screen==='otp-code'){app.innerHTML=navBar()+otpCodeScreen();wireOtpCode();return;}
  if(ST.screen==='otp-name'){app.innerHTML=navBar()+otpNameScreen();wireOtpName();return;}
  if(ST.screen==='student-login'){app.innerHTML=navBar()+loginScreen();wireStudentLogin();return;}
  const body=ST.screen==='player'?playerScreen():listScreen();
  app.innerHTML=navBar()+`<main><div class="app-main">${body}</div></main>`;
  wireApp();
}

function goStart(){ST.screen='otp-phone';render();}

function wireBrowse(){
  document.getElementById('nav-logo').addEventListener('click',()=>{window.scrollTo({top:0,behavior:'smooth'});});
  document.getElementById('nav-cta').addEventListener('click',goStart);
  document.getElementById('nav-student-link').addEventListener('click',()=>{ST.screen='student-login';render();});
  document.getElementById('btn-start').addEventListener('click',goStart);
  document.getElementById('btn-start-2').addEventListener('click',goStart);
  document.querySelectorAll('[data-apply-course]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      setPendingApply(btn.dataset.applyCourse);
      alert('먼저 로그인해주세요 — 로그인/가입이 끝나면 자동으로 신청됩니다.');
      goStart();
    });
  });
}

function wireOtpPhone(){
  const phoneEl=document.getElementById('otp-phone');
  const btn=document.getElementById('otp-req-btn'),err=document.getElementById('otp-err');
  const submit=()=>doOtpRequest(phoneEl.value.trim(),err,btn);
  btn.onclick=submit;
  phoneEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  document.getElementById('btn-google').addEventListener('click',()=>{location.href='/api/member-auth/google-start';});
  document.getElementById('btn-back-browse').addEventListener('click',()=>{ST.screen='browse';render();});
}

function wireOtpCode(){
  const codeEl=document.getElementById('otp-code');
  const btn=document.getElementById('otp-verify-btn'),err=document.getElementById('otp-err');
  const submit=()=>doOtpVerify(codeEl.value.trim(),err,btn);
  btn.onclick=submit;
  codeEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  document.getElementById('btn-resend').addEventListener('click',()=>{ST.screen='otp-phone';render();});
}

function wireOtpName(){
  const nameEl=document.getElementById('otp-name');
  const btn=document.getElementById('otp-name-btn'),err=document.getElementById('otp-err');
  const submit=()=>doProfileSave(nameEl.value.trim(),err,btn);
  btn.onclick=submit;
  nameEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
}

function wireStudentLogin(){
  const idEl=document.getElementById('lg-id'),pwEl=document.getElementById('lg-pw');
  const btn=document.getElementById('lg-btn'),err=document.getElementById('lg-err');
  const submit=()=>doStudentLogin(idEl.value.trim(),pwEl.value,err,btn);
  btn.onclick=submit;
  pwEl.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  document.getElementById('btn-back-browse').addEventListener('click',()=>{ST.screen='browse';render();});
}

function wireApp(){
  document.getElementById('btn-logout')?.addEventListener('click',doLogout);
  document.getElementById('btn-back')?.addEventListener('click',()=>{ST.screen='list';ST.active=null;render();});
  document.querySelectorAll('[data-vid]').forEach(card=>{
    card.addEventListener('click',()=>{
      const v=(ST.videos||[]).find(x=>x.id===card.dataset.vid);
      if(!v)return;
      ST.active=v;ST.screen='player';render();
    });
  });
}

boot();
</script>
